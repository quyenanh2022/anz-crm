<!doctype html><html translate="no"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="google" content="notranslate"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body class="notranslate" translate="no">
<title>Seller Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root{
    --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#FBFAF7;--border:#E7E2D9;
    --border-strong:#D8D2C6;--ink:#211E19;--muted:#6E685E;
    --accent:#0F766E;--accent-ink:#0B5A54;--accent-soft:#DCF3EE;
    --zalo:#0068FF;--gmail:#C5341F;--amber:#B4690E;
    --blue:#2563EB;--blue-soft:#DEEAFD;--green:#15803D;--green-soft:#D9F2E1;
    --amber-soft:#F7EBD3;--danger:#C13A2B;--danger-soft:#F7E2DE;
    --shadow:0 1px 2px rgba(30,25,18,.04),0 4px 16px rgba(30,25,18,.05);
    --shadow-lg:0 8px 40px rgba(30,25,18,.16);
    --radius:14px;color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#16150F;--surface:#201E17;--surface-2:#1A1913;--border:#33301F;
      --border-strong:#413D2A;--ink:#F1EEE4;--muted:#A7A090;
      --accent:#4FD1BF;--accent-ink:#8DE6D8;--accent-soft:#123B36;
      --zalo:#5AA0FF;--gmail:#F08A78;--amber:#E0A54A;
      --blue:#6BA2FF;--blue-soft:#16263F;--green:#5BD08A;--green-soft:#12301E;
      --amber-soft:#38290F;--danger:#EC8272;--danger-soft:#3A211C;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
      --shadow-lg:0 10px 44px rgba(0,0,0,.55);color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16150F;--surface:#201E17;--surface-2:#1A1913;--border:#33301F;
    --border-strong:#413D2A;--ink:#F1EEE4;--muted:#A7A090;
    --accent:#4FD1BF;--accent-ink:#8DE6D8;--accent-soft:#123B36;
    --zalo:#5AA0FF;--gmail:#F08A78;--amber:#E0A54A;
    --blue:#6BA2FF;--blue-soft:#16263F;--green:#5BD08A;--green-soft:#12301E;
    --amber-soft:#38290F;--danger:#EC8272;--danger-soft:#3A211C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    --shadow-lg:0 10px 44px rgba(0,0,0,.55);color-scheme:dark;
  }
  *{box-sizing:border-box}
  :root{padding-top:0!important}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
  a{color:inherit}

  /* ===== SIDEBAR LAYOUT ===== */
  .shell{display:flex;align-items:stretch;min-height:100%}
  .sidebar{width:214px;flex:none;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    padding-top:env(safe-area-inset-top,0px);transition:width .16s ease;z-index:20}
  .sidebar.collapsed{width:60px}
  .side-top{display:flex;align-items:center;gap:8px;padding:14px 12px 12px;border-bottom:1px solid var(--border);min-height:60px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
    box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
  .bname{min-width:0}
  .brand h1{font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
  .side-toggle{margin-left:auto;flex:none;width:30px;height:30px;border:1px solid var(--border);border-radius:8px;
    background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.15s}
  .side-toggle:hover{color:var(--accent-ink);border-color:var(--accent)}
  .side-nav{display:flex;flex-direction:column;gap:3px;padding:10px 8px;flex:1;overflow-y:auto;overflow-x:hidden}
  .side-sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    padding:12px 11px 4px;opacity:.75}
  .side-sec:first-child{padding-top:2px}
  .sidebar.collapsed .side-sec{display:none}
  .side-nav .snav:has(.lbl.sub){margin-left:16px}
  .side-nav .snav:has(.lbl.sub)::before{content:"";position:absolute;left:-9px;top:50%;width:8px;height:1.5px;background:var(--border-strong)}
  .snav .lbl.sub{font-weight:500}
  .sidebar.collapsed .side-nav .snav:has(.lbl.sub){margin-left:0}
  .sidebar.collapsed .side-nav .snav:has(.lbl.sub)::before{display:none}
  .side-bottom{display:flex;flex-direction:column;gap:3px;padding:8px;border-top:1px solid var(--border)}
  .snav{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;background:transparent;
    border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;text-align:left;transition:.12s;white-space:nowrap}
  .snav:hover{background:var(--surface-2);color:var(--ink)}
  .snav.on{background:var(--accent-soft);color:var(--accent-ink)}
  .snav svg{flex:none}
  .snav .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
  .snav .cnt{font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);padding:1px 7px;border-radius:99px;flex:none}
  .snav.on .cnt{background:var(--accent);color:#fff}
  .sidebar.collapsed .bname,.sidebar.collapsed .snav .lbl,.sidebar.collapsed .snav .cnt{display:none}
  .sidebar.collapsed .side-top{flex-direction:column;gap:10px;padding:14px 8px 12px}
  .sidebar.collapsed .snav{justify-content:center;padding:10px 0}
  .main{flex:1;min-width:0}
  @media (max-width:760px){
    .shell{flex-direction:column}
    .sidebar,.sidebar.collapsed{width:auto;height:auto;position:sticky;top:0;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
    .side-top{order:0;flex:1 1 auto;min-width:0;border-bottom:0;min-height:0;padding:9px 12px}
    .sidebar.collapsed .side-top{flex-direction:row}
    .side-bottom{order:1;flex:0 0 auto;flex-direction:row;border-top:0;padding:9px 10px 9px 0;gap:6px}
    .side-bottom .snav{flex:none;width:34px;height:34px;padding:0;justify-content:center;border:1px solid var(--border);border-radius:9px}
    .side-bottom .snav .lbl{display:none}
    .side-nav{order:2;flex:1 1 100%;flex-direction:row;padding:0 8px 9px;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
    .side-nav::-webkit-scrollbar{display:none}
    .side-nav .snav{position:relative;flex:0 0 74px;width:74px;min-width:74px;overflow:hidden;scroll-snap-align:start;flex-direction:column;gap:3px;padding:7px 3px;font-size:11px;
      border:1px solid var(--border);border-radius:11px;text-align:center;justify-content:flex-start}
    .side-nav .snav.on{border-color:var(--accent)}
    .side-nav .snav .lbl{display:block;flex:none;max-width:100%;font-size:10.5px;line-height:1.15;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side-nav .snav .cnt{display:inline;position:absolute;top:3px;right:5px;font-size:9px;padding:0 4px;line-height:1.5}
    .side-nav .snav svg{width:18px;height:18px}
    .side-sec{display:none}
    .side-nav .snav:has(.lbl.sub){margin-left:0}
    .side-nav .snav:has(.lbl.sub)::before{display:none}
    .side-toggle{display:none}
  }

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
    padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;
    background:var(--surface);color:var(--ink);transition:.15s;white-space:nowrap;text-decoration:none}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn-primary{background:var(--accent);color:#fff;border-color:transparent}
  .btn-primary:hover{background:var(--accent-ink);color:#fff}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
  .icon-btn{width:38px;height:38px;padding:0;justify-content:center;flex:none}

  .wrap{max-width:1160px;margin:0 auto;padding:20px 20px 90px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .search{position:relative;flex:1 1 240px;min-width:170px;max-width:400px}
  .search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border-strong);
    border-radius:10px;background:var(--surface);outline:none;transition:.15s}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  select.filter{padding:9px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);outline:none;font-weight:500;max-width:220px}
  select.filter:focus{border-color:var(--accent)}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);padding:3px;border-radius:10px}
  .seg button{border:0;background:transparent;padding:7px 9px;border-radius:8px;color:var(--muted);display:grid;place-items:center;transition:.15s}
  .seg button.on{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}

  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);min-width:110px}
  .stat .n{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .stat .l{font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  @media (max-width:760px){
    #seg [data-v="table"],#seg [data-v="kanban"],#seg [data-v="tree"],#seg [data-v="mind"]{display:none}
    .toolbar{gap:8px;margin-bottom:12px}
    #grpBtn .glbl{display:none}
    #grpBtn,#xlsBtn{padding:8px 11px}
    .stats{gap:8px;margin-bottom:12px}
    .stat{flex:1 1 0;min-width:0;padding:9px 10px}
    .stat .n{font-size:18px}
    .stat .l{font-size:10px}
  }

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .card-top{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .avatar{width:44px;height:44px;border-radius:12px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1;color:#fff;text-align:center;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
  .avatar.sm{width:34px;height:34px;font-size:14px;border-radius:10px}
  .card-id{flex:1;min-width:0}
  .card-id h3{font-size:16px;line-height:1.25;overflow-wrap:anywhere}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .role-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
    padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
  .task-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
    padding:2px 9px;border-radius:99px;background:var(--amber-soft);color:var(--amber)}
  .stage-badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px}
  .q-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
  .qcard{padding:14px 16px;gap:6px}
  .qcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .qno{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .qpill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid;margin-top:3px}
  .qtitle{font-size:15px;font-weight:600;margin-top:2px}
  .qwho{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
  .qtotal{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:6px;color:var(--accent-ink)}
  .qmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .qitems-head{display:grid;grid-template-columns:1fr 56px 110px 110px 30px;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:0 2px 6px}
  .qitem{display:grid;grid-template-columns:1fr 56px 110px 110px 30px;gap:8px;align-items:center;margin-bottom:8px}
  .qitem input{padding:8px 10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface-2);outline:none;width:100%}
  .qitem input:focus{border-color:var(--accent);background:var(--surface)}
  .qi-amt{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .qi-del{width:28px;height:28px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer}
  .qi-del:hover{color:var(--danger);border-color:var(--danger)}
  .qtotal-row{text-align:right;font-size:15px;margin-top:6px;padding-top:10px;border-top:1px solid var(--border)}
  .qtotal-row b{font-size:19px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .qinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .qinfo .field{margin-bottom:0}
  @media (max-width:560px){.qinfo{grid-template-columns:1fr}}
  .qgroup{border-bottom:1px dashed var(--border);padding:12px 0}
  .qgroup:last-child{border-bottom:0}
  .qg-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .qg-head input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none;cursor:pointer}
  .group-code{font-weight:700;font-size:12px;color:var(--gmail);border:1px solid var(--gmail);border-radius:99px;padding:1px 8px;flex:none;margin-top:1px}
  .qg-titles{flex:1;min-width:0}
  .qg-titles .t{font-weight:600;font-size:14px}
  .qg-titles .s{font-size:12px;color:var(--muted)}
  .qg-body{margin:10px 0 0 38px;padding-left:14px;border-left:2px solid var(--border);display:none}
  .qgroup.open .qg-body{display:block}
  .bullets{margin:0 0 10px;padding-left:18px;font-size:12.5px;color:var(--muted)}
  .bullets li{margin-bottom:2px}
  .qg-item{display:grid;grid-template-columns:1fr 130px 120px 120px;gap:10px;align-items:end;padding:8px 0;border-top:1px solid var(--border)}
  .qg-item:first-of-type{border-top:0}
  .qg-name{font-size:13px;font-weight:500}
  .qg-badge{display:inline-block;font-size:10px;margin-left:6px;padding:1px 7px;border-radius:99px;border:1px solid var(--border-strong);color:var(--muted);vertical-align:middle}
  .qg-badge.recur{border-color:var(--accent);color:var(--accent-ink)}
  .qg-range{font-size:11px;color:var(--muted);margin-top:3px;font-weight:400}
  .qg-item input{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface-2);outline:none}
  .qg-item input:focus{border-color:var(--accent);background:var(--surface)}
  .qg-sub{text-align:right;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;padding-bottom:8px}
  @media (max-width:560px){.qg-item{grid-template-columns:1fr 1fr}.qg-name{grid-column:1/-1}.qg-sub{grid-column:1/-1;text-align:left}}
  .qsum{margin-top:16px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .qsum-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:13.5px;background:var(--surface-2)}
  .qsum-row b{font-variant-numeric:tabular-nums}
  .qsum-row.final{background:var(--accent);color:#fff;font-size:15px}
  .qsum-row.final b{color:#fff}
  .proj-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .projcard{overflow:hidden}
  .projcard-top{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;padding-left:13px}
  .proj-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .pm{background:var(--surface);padding:10px 6px;text-align:center}
  .pm-n{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pm-l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-top:2px}
  .treewrap{display:flex;flex-direction:column;gap:10px}
  .tnode{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .tnode-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:default}
  .tdot{width:11px;height:11px;border-radius:50%;flex:none}
  .tname{font-weight:700;font-size:15px}
  .tmeta2{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  @media (max-width:560px){.tmeta2{display:none}}
  .kbcols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
  @media (max-width:900px){.kbcols{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.kbcols{grid-template-columns:1fr}}
  .mmwrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
  .mmcanvas{position:relative}
  .mm-lines{position:absolute;inset:0;pointer-events:none}
  .mm-node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;border-radius:9px;
    font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border:2px solid var(--mmc);background:var(--surface);box-shadow:0 1px 3px rgba(30,25,18,.06);box-sizing:border-box}
  .mm-root{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800;font-size:20px;letter-spacing:.03em;border-radius:50%;box-shadow:var(--shadow-lg)}
  .mm-proj{background:color-mix(in srgb,var(--mmc) 13%,var(--surface));color:var(--ink)}
  .mm-cust{cursor:pointer}
  .mm-cust:hover{background:var(--surface-2);border-color:var(--accent)}
  .pgrid{display:flex;gap:12px;margin-top:4px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .pgrid::-webkit-scrollbar{height:8px}
  .pgrid::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px}
  .pcard{flex:0 0 150px;width:150px;scroll-snap-align:start;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column}
  .pcard-img{position:relative;aspect-ratio:1/1;background:var(--surface-2);overflow:hidden}
  .pcard-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .pcard-noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.4}

<script type="text/plain" id="scInstaller">#!/bin/bash
# Seller Network — trình mở Chrome theo profile (chạy ngầm tại http://127.0.0.1:47321)
# Chạy: mở Terminal, gõ  bash  rồi kéo thả file này vào, Enter.
set -e
DIR="$HOME/Library/Application Support/SellerChrome"
mkdir -p "$DIR" "$HOME/Library/LaunchAgents"
echo "→ Đang cài trình mở Chrome…"
cat > "$DIR/server.pl" <<'PERL_SRC'
#!/usr/bin/perl
# SellerChrome: http://127.0.0.1:47321  /open?p=<tên profile>&u=<link>  |  /open?dir=<thư mục>  |  /list
use strict; use warnings; use utf8;
use IO::Socket::INET; use JSON::PP; use Unicode::Normalize; use Encode qw(decode encode);
my $HOME = $ENV{HOME} || (getpwuid($<))[7];
my $srv = IO::Socket::INET->new(LocalAddr=>'127.0.0.1', LocalPort=>47321, Listen=>10, ReuseAddr=>1, Proto=>'tcp') or die "listen: $!";
sub udec { my $s = shift // ''; $s =~ tr/+/ /; $s =~ s/%([0-9A-Fa-f]{2})/chr(hex $1)/ge; my $d = eval { decode('UTF-8', $s) }; defined $d ? $d : $s }
sub uenc { my $s = encode('UTF-8', shift // ''); $s =~ s/([^A-Za-z0-9._~-])/sprintf('%%%02X', ord $1)/ge; $s }
sub h { my $s = shift // ''; $s =~ s/&/&amp;/g; $s =~ s/</&lt;/g; $s =~ s/>/&gt;/g; $s =~ s/"/&quot;/g; $s =~ s/'/&#39;/g; $s }
sub norm { my $s = lc(NFD(shift // '')); $s =~ s/\p{Mn}//g; $s =~ s/đ/d/g; $s =~ s/[^a-z0-9@.]+/ /g; $s =~ s/^\s+|\s+$//g; $s }
sub profiles {
  my $f = "$HOME/Library/Application Support/Google/Chrome/Local State";
  open(my $fh, '<:raw', $f) or return ();
  local $/; my $raw = <$fh>; close $fh;
  my $j = eval { decode_json($raw) } || {};
  my $ic = ($j->{profile} || {})->{info_cache} || {};
  my @p = map { { dir => $_, name => ($ic->{$_}{name} // $_), gaia => ($ic->{$_}{gaia_name} // ''), user => ($ic->{$_}{user_name} // '') } } keys %$ic;
  return sort { lc($a->{name}) cmp lc($b->{name}) } @p;
}
sub find_profile {
  my ($want, @ps) = @_; my $w = norm($want); return undef unless length $w;
  my $sq = sub { my $x = norm(shift); $x =~ s/ //g; $x }; my $ws = $sq->($want);
  my @tests = (
    sub { lc($_[0]{dir}) eq lc($want) },
    sub { norm($_[0]{name}) eq $w },
    sub { norm($_[0]{gaia}) eq $w || norm($_[0]{user}) eq $w },
    sub { $sq->($_[0]{name}) eq $ws || $sq->($_[0]{gaia}) eq $ws || $sq->($_[0]{user}) eq $ws },
    sub { index(norm($_[0]{name}), $w) == 0 || index(norm($_[0]{gaia}), $w) == 0 },
    sub { my $n = norm($_[0]{name}); index($n, $w) >= 0 || index(norm($_[0]{gaia}), $w) >= 0 || (length($n) > 3 && index($w, $n) >= 0) },
  );
  for my $t (@tests) { my @hit = grep { $t->($_) } @ps; return $hit[0] if @hit == 1; return undef if @hit > 1; }
  return undef;
}
sub launch {
  my ($dir, $u) = @_;
  my @a = ('/usr/bin/open', '-na', 'Google Chrome', '--args', "--profile-directory=$dir");
  push @a, encode('UTF-8', $u) if $u && $u =~ m{^https?://}i;
  system(@a);
}
my $CSS = 'body{font:15px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:28px;background:#F6F5F1;color:#211E19}h2{font-size:18px;margin:0 0 6px}p{color:#6E685E;margin:0 0 16px}.r{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E7E2D9;border-radius:12px;padding:10px 14px;margin-bottom:8px}.n{flex:1}.n small{display:block;color:#6E685E}a.b,button{border:1px solid #D8D2C6;background:#fff;border-radius:9px;padding:7px 12px;font:600 13px -apple-system,sans-serif;color:#0B5A54;text-decoration:none;cursor:pointer}a.b{background:#0F766E;color:#fff;border-color:#0F766E}';
sub page { my ($title, $inner, $close) = @_;
  return "<!doctype html><html><head><meta charset=utf-8><title>SellerChrome</title><style>$CSS</style></head><body>$inner"
   . ($close ? "<scr" . "ipt>setTimeout(function(){window.close()},500)</scr" . "ipt>" : "")
   . "<scr" . "ipt>function cp(t,b){navigator.clipboard.writeText(t).then(function(){b.textContent='Đã chép ✓'})}</scr" . "ipt></body></html>"; }
sub picker { my ($want, $u, @ps) = @_;
  my $msg = length($want) ? "Không tìm thấy đúng profile “" . h($want) . "”. Chọn profile cần mở — bấm <b>Chép tên</b> rồi dán vào ô Profile Chrome trong Seller Network để lần sau mở thẳng." : "Danh sách profile Chrome trên máy. Bấm <b>Chép tên</b> rồi dán vào ô Profile Chrome của khách trong Seller Network.";
  my $rows = join '', map { my $p = $_;
    "<div class=r><div class=n>" . h($p->{name}) . ($p->{gaia} && $p->{gaia} ne $p->{name} ? "<small>" . h($p->{gaia}) . "</small>" : "") . "</div>"
    . "<button onclick=\"cp(this.dataset.n,this)\" data-n=\"" . h($p->{name}) . "\">Chép tên</button>"
    . "<a class=b href=\"/open?dir=" . uenc($p->{dir}) . "&u=" . uenc($u) . "\">Mở</a></div>" } @ps;
  $rows ||= "<p>Không đọc được danh sách profile của Google Chrome.</p>";
  return page('', "<h2>Seller Chrome</h2><p>$msg</p>$rows", 0);
}
$SIG{CHLD} = 'IGNORE';
while (1) {
  my $c = $srv->accept or next;
  my $pid = fork();
  if (!defined $pid) { close $c; next; }
  if ($pid) { close $c; next; }   # tiến trình cha: nhận kết nối tiếp (trình duyệt hay mở sẵn kết nối rỗng)
  close $srv;
  local $SIG{ALRM} = sub { exit 0 }; alarm 10;
  my $req = <$c> // '';
  while (defined(my $l = <$c>)) { last if $l =~ /^\r?\n$/; }
  my ($path, $qs) = $req =~ m{^GET\s+([^\s?]*)\??(\S*)};
  $path //= '/'; $qs //= '';
  my %q; for my $kv (split /&/, $qs) { my ($k, $v) = split /=/, $kv, 2; $q{$k} = udec($v) if defined $k; }
  my @ps = profiles();
  my $u = $q{u} // ''; $u = '' unless $u =~ m{^https?://}i;
  my $body;
  if ($path eq '/open' && defined $q{dir} && grep { $_->{dir} eq $q{dir} } @ps) {
    launch($q{dir}, $u); $body = page('', "<p>Đang mở Chrome… (tab này tự đóng)</p>", 1);
  } elsif ($path eq '/open' && defined $q{p}) {
    my $hit = find_profile($q{p}, @ps);
    if ($hit) { launch($hit->{dir}, $u); $body = page('', "<p>Đang mở Chrome — " . h($hit->{name}) . "… (tab này tự đóng)</p>", 1); }
    else { $body = picker($q{p}, $u, @ps); }
  } elsif ($path eq '/list' || $path eq '/open') {
    $body = picker('', $u, @ps);
  } else {
    $body = page('', "<p>SellerChrome đang chạy.</p>", 0);
  }
  my $bytes = encode('UTF-8', $body);
  print $c "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nCache-Control: no-store\r\nContent-Length: " . length($bytes) . "\r\nConnection: close\r\n\r\n" . $bytes;
  close $c;
  exit 0;
}

  function renderSellersMindmap(v,shown){
    const shownIds=new Set(shown.map(s=>s.id));
    const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","vi");
    const custNode=s=>({id:s.id,label:s.name||"—",kind:"cust",color:colorFor(s.name||s.id),children:[]});
    const projNode=p=>({id:p.id,label:p.name,kind:"proj",color:projColor(p,projects.indexOf(p)),
      children:childProjects(p.id).map(projNode).concat(sellersOfProject(p.id).filter(s=>shownIds.has(s.id)).sort(byName).map(custNode))});
    const roots=rootProjects().map(projNode);
    const un=sellers.filter(s=>(!s.projectId||!projectById(s.projectId))&&shownIds.has(s.id)).sort(byName);
    if(un.length)roots.push({id:"none",label:"Chưa xếp dự án",kind:"proj",color:"#9a938a",children:un.map(custNode)});
    if(!roots.length){v.appendChild(el("div","empty",`<h3>Chưa có dữ liệu</h3><p>Thêm khách và xếp dự án để xem mindmap.</p>`));return;}
    const root={id:"root",label:"SN",kind:"root",color:"var(--accent)",children:roots};
    const leaves=n=>n.children.length?n.children.reduce((a,c)=>a+leaves(c),0):1;
    const ROW=40,COLW=196,BOXW=170,BOXH=30,RR=44,GAP=26;
    // chia nhánh sang 2 bên cho cân
    const rs=[],ls=[];let rl=0,ll=0;
    roots.slice().sort((a,b)=>leaves(b)-leaves(a)).forEach(r=>{if(rl<=ll){rs.push(r);rl+=leaves(r);}else{ls.push(r);ll+=leaves(r);}});
    function layoutSide(list,sign){let cur=0;
      const f=(n,d)=>{n._depth=d;n._sign=sign;if(!n.children.length){n._cy=cur+ROW/2;cur+=ROW;return;}n.children.forEach(c=>f(c,d+1));n._cy=(n.children[0]._cy+n.children[n.children.length-1]._cy)/2;};
      list.forEach(r=>f(r,1));
      return cur;}
    const rh=layoutSide(rs,1),lh=layoutSide(ls,-1);
    root.cx=0;root.cy=0;
    const nodes=[root],edges=[];
    (function walk(n){n.children.forEach(c=>{
      const H=c._sign>0?rh:lh;
      c.cx=c._sign*(RR+GAP+(c._depth-1)*COLW+BOXW/2);
      c.cy=c._cy-H/2;
      edges.push([n,c]);nodes.push(c);walk(c);});})(root);
    let minX=-RR,maxX=RR,minY=-RR,maxY=RR;
    nodes.forEach(n=>{if(n.kind==="root")return;minX=Math.min(minX,n.cx-BOXW/2);maxX=Math.max(maxX,n.cx+BOXW/2);minY=Math.min(minY,n.cy-BOXH/2);maxY=Math.max(maxY,n.cy+BOXH/2);});
    const M=24,offX=M-minX,offY=M-minY,W=Math.round(maxX-minX+M*2),H=Math.round(maxY-minY+M*2);
    const paths=edges.map(([a,b])=>{const s=b._sign;
      const x1=(a.kind==="root"?s*RR:a.cx+s*BOXW/2)+offX,y1=a.cy+offY,x2=(b.cx-s*BOXW/2)+offX,y2=b.cy+offY,mx=(x1+x2)/2;
      return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} C${mx.toFixed(1)} ${y1.toFixed(1)} ${mx.toFixed(1)} ${y2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${b.color}" stroke-width="${Math.max(1.5,3-(b._depth||1)*0.5).toFixed(1)}" opacity="0.55"/>`;}).join("");
    const nodeHtml=nodes.map(n=>{
      if(n.kind==="root")return `<div class="mm-node mm-root" style="left:${(offX-RR).toFixed(1)}px;top:${(offY-RR).toFixed(1)}px;width:${RR*2}px;height:${RR*2}px;--mmc:var(--accent)">${esc(n.label)}</div>`;
      const left=(n.cx+offX-BOXW/2).toFixed(1),top=(n.cy+offY-BOXH/2).toFixed(1),ta=n._sign>0?"left":"right";
      return `<div class="mm-node mm-${n.kind}${n.kind==="cust"?'" data-detail="'+n.id:''}" style="left:${left}px;top:${top}px;width:${BOXW}px;height:${BOXH}px;text-align:${ta};justify-content:${n._sign>0?"flex-start":"flex-end"};--mmc:${n.color}" title="${esc(n.label)}">${esc(n.label)}</div>`;}).join("");
    const wrap=el("div","mmwrap");
    wrap.innerHTML=`<div class="mmcanvas" style="width:${W}px;height:${H}px"><svg class="mm-lines" width="${W}" height="${H}">${paths}</svg>${nodeHtml}</div>`;
    v.appendChild(wrap);
    requestAnimationFrame(()=>{try{wrap.scrollLeft=(W-wrap.clientWidth)/2;wrap.scrollTop=(H-wrap.clientHeight)/2;}catch(e){}});
  }

  function actLinks(s){

  function getOrd(t){return typeof t.order==="number"?t.order:(t.createdAt?Date.parse(t.createdAt)||0:0);}
  function afterEl(body,y){
    const els=[...body.querySelectorAll(".titem:not(.dragging)")];
    return els.reduce((c,ch)=>{const b=ch.getBoundingClientRect();const off=y-b.top-b.height/2;
      return off<0&&off>c.off?{off,el:ch}:c;},{off:-Infinity,el:null}).el;
  }
  let dragId=null,wasDragging=false;
  function attachDnD(cols){
    cols.querySelectorAll(".titem.drag").forEach(it=>{
      it.addEventListener("dragstart",e=>{dragId=it.dataset.task;it.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId);}catch(_){}});
      it.addEventListener("dragend",()=>{it.classList.remove("dragging");wasDragging=true;setTimeout(()=>wasDragging=false,120);cols.querySelectorAll(".tcol").forEach(c=>c.classList.remove("over"));});
    });
    cols.querySelectorAll(".tcol").forEach(col=>{
      const body=col.querySelector(".tcol-body");
      col.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";col.classList.add("over");
        const after=afterEl(body,e.clientY);const d=body.querySelector(".dragging");if(!d)return;
        const empty=body.querySelector(".tempty");if(empty)empty.remove();
        if(after)body.insertBefore(d,after);else body.appendChild(d);});
      col.addEventListener("dragleave",e=>{if(!col.contains(e.relatedTarget))col.classList.remove("over");});
      col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");dropTask(col,body);});
    });
  }
  async function dropTask(col,body){
    const id=dragId;dragId=null;const t=tasks.find(x=>x.id===id);if(!t||!db)return;
    const status=col.dataset.status;
    const ids=[...body.querySelectorAll(".titem")].map(el=>el.dataset.task);
    const pos=ids.indexOf(id);
    const beforeT=pos>0?tasks.find(x=>x.id===ids[pos-1]):null;
    const afterT=pos<ids.length-1?tasks.find(x=>x.id===ids[pos+1]):null;
    let ord;
    if(!beforeT&&!afterT)ord=Date.now();
    else if(!beforeT)ord=getOrd(afterT)-1e6;
    else if(!afterT)ord=getOrd(beforeT)+1e6;
    else ord=(getOrd(beforeT)+getOrd(afterT))/2;
    if(t.status===status&&t.order===ord)return;
    try{await db.collection(TC).doc(id).update({status,order:ord,updatedAt:new Date().toISOString()});}
    catch(err){toast(err&&err.code==="invalid_argument"?"Bạn không có quyền chỉnh sửa":"Di chuyển thất bại");}
  }

  async function ensureSellerFolderId(sellerId,name,noAsk){
    const s=sellerById(sellerId)||{};
    if(s.driveFolderId)return s.driveFolderId;
    const master=driveFolderId(settings.driveMasterLink||settings.driveMasterId||"");
    if(!master||!mcp)return null;
    try{
      let id="",url="";
      try{const qy="title = '"+(name||"").replace(/'/g,"\\'")+"' and mimeType = 'application/vnd.google-apps.folder' and parentId = '"+master+"'";
        const sr=await mcp.callTool(DRIVE,"search_files",{query:qy,pageSize:1});
        const files=(sr.payload&&(sr.payload.files||sr.payload.data))||[];
        if(files.length){id=files[0].id;url=files[0].viewUrl||("https://drive.google.com/drive/folders/"+id);}}catch(e){}
      if(!id){if(!noAsk){if(folderDeclined[sellerId])return null;if(!(await askCreateFolder(name))){folderDeclined[sellerId]=true;return null;}}
        const r=await mcp.callTool(DRIVE,"create_file",{title:name||"Khách",parentId:master,mimeType:"application/vnd.google-apps.folder"});const f=r.payload||{};id=f.id;url=f.viewUrl||("https://drive.google.com/drive/folders/"+id);}
      if(id)await db.collection(SC).doc(sellerId).update({driveFolderId:id,driveFolderLink:url,updatedAt:new Date().toISOString()});
      return id;
    }catch(e){return null;}
  }
  function fmtVNDate(d){return d.toLocaleDateString("vi-VN");}
  function buildQuoteXlsxBase64(d){
    const X=window.XLSX;
    const COLS=['B','C','D','E','F','G','H'];
    const rows=[],rh=[];
    const push=(a,h)=>{rows.push(a);rh.push(h);};
    const today=new Date();const validTo=new Date(today.getTime()+(Number(d.validDays)||15)*86400000);
    push(['','BÁO GIÁ DỊCH VỤ','','','','','',''],32);
    push(['','ANZMedia — Báo giá dịch vụ TikTok Shop cho '+d.name+' (kênh: '+(d.channel||'—')+')','','','','','',''],18);
    push(['','Kính gửi: '+d.name,'','','','Ngày lập: '+fmtVNDate(today)+'  |  Hiệu lực đến: '+fmtVNDate(validTo),'',''],18);
    push(['','','','','','','',''],8);
    push(['','STT','NỘI DUNG','CHI TIẾT','ĐƠN VỊ','SỐ LƯỢNG','ĐƠN GIÁ','TỔNG'],32);
    push(['','I. DỊCH VỤ ĐÃ CHỌN','','','','','',''],20);
    const itemStart=rows.length,extraMerges=[];
    if(!d.lines.length){push(['','','(chưa chọn dịch vụ nào)','','','','',''],24);}
    else{const byItem=d.detailMode==="item",grp={};
      d.lines.forEach((l,i)=>{const g=CATALOG.find(x=>x.code===l.code);const gb=g?(g.bullets||[]).join('\n'):'';
        let det;if(byItem){const ci=l.id?catItem(l.id):null;det=String(l.detail||(ci&&ci.it.detail)||'').trim()||gb;}
        else{det=grp[l.code]?'':gb;if(!grp[l.code])grp[l.code]={start:rows.length,end:rows.length};else grp[l.code].end=rows.length;}
        const n=Math.max(1,String(det||gb).split('\n').length);
        push(['',i+1,l.label,det,l.unit,l.qty,l.pct?(l.rate+'% × '+vnd(l.base)):vnd(l.price),vnd(l.subtotal)],Math.max(28,15*n+10));});
      Object.keys(grp).forEach(k=>{const gr=grp[k];if(gr.end>gr.start)extraMerges.push({s:{r:gr.start,c:3},e:{r:gr.end,c:3}});});}
    const lastItem=rows.length-1;
    const grandR=rows.length;push(['','Grand Total (-VAT)','','','','','',vnd(d.grandTotal)],20);
    const vatR=rows.length;push(['','VAT (8%)','','','','','',vnd(d.vat)],20);
    const finalR=rows.length;push(['','TỔNG CỘNG (+VAT)','','','','','',vnd(d.grandTotal+d.vat)],22);
    push(['','','','','','','',''],8);
    const noteStart=rows.length;
    push(['','Ghi chú:','','','','','',''],15);
    push(['','● Cột TỔNG = Số lượng × Đơn giá.','','','','','',''],15);
    const freeNames=d.lines.filter(l=>{const ci=l.id?catItem(l.id):null;return ci&&ci.it.freeform;}).map(l=>l.label);
    if(freeNames.length)push(['','● Đơn giá tự nhập ('+freeNames.join(', ')+') cần chốt với khách trước khi ký.','','','','','',''],15);
    d.lines.filter(l=>l.pct).forEach(l=>push(['','● '+l.label+' = '+l.rate+'% × tổng '+(l.pctBase==='all'?'các dịch vụ đã chọn':'các hạng mục cùng nhóm')+' ('+vnd(l.base)+').','','','','','',''],15));
    push(['','● Báo giá hiệu lực '+(Number(d.validDays)||15)+' ngày kể từ ngày lập ('+fmtVNDate(today)+').','','','','','',''],15);
    if(d.note)push(['','● Ghi chú thêm: '+d.note,'','','','','',''],15);
    const ws=X.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:3},{wch:6},{wch:20},{wch:44},{wch:14},{wch:10},{wch:16},{wch:16}];
    ws['!rows']=rh.map(h=>({hpt:h}));
    ws['!merges']=[{s:{r:0,c:1},e:{r:0,c:7}},{s:{r:1,c:1},e:{r:1,c:7}},{s:{r:2,c:5},e:{r:2,c:7}},{s:{r:5,c:1},e:{r:5,c:7}},
      {s:{r:grandR,c:1},e:{r:grandR,c:6}},{s:{r:vatR,c:1},e:{r:vatR,c:6}},{s:{r:finalR,c:1},e:{r:finalR,c:6}}].concat(extraMerges);
    const set=(r,c,st)=>{const a=COLS[c]+(r+1);if(!ws[a])ws[a]={t:'s',v:''};ws[a].s=st;};
    const B=hex=>({top:{style:'thin',color:{rgb:hex}},bottom:{style:'thin',color:{rgb:hex}},left:{style:'thin',color:{rgb:hex}},right:{style:'thin',color:{rgb:hex}}});
    set(0,0,{font:{name:'Arial',bold:true,sz:18}});
    set(1,0,{font:{name:'Arial',sz:10,color:{rgb:'5B655F'}}});
    set(2,0,{font:{name:'Arial',sz:11,bold:true,color:{rgb:'1C2420'}}});
    set(2,5,{font:{name:'Arial',sz:10,color:{rgb:'5B655F'}}});
    const head={font:{name:'Arial',bold:true,sz:10,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'1C2420'}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:B('C9CFC9')};
    COLS.forEach((c,i)=>set(4,i,head));
    set(5,0,{font:{name:'Arial',bold:true,sz:10,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'2E5E8C'}},alignment:{horizontal:'left',vertical:'center'}});
    const body={font:{name:'Arial',sz:10},alignment:{vertical:'top',wrapText:true},border:B('E3E6E1')};
    const num={font:{name:'Arial',sz:10},alignment:{horizontal:'right',vertical:'top',wrapText:true},border:B('E3E6E1')};
    for(let r=itemStart;r<=lastItem;r++)COLS.forEach((c,i)=>set(r,i,i>=4?num:body));
    COLS.forEach((c,i)=>set(grandR,i,{font:{name:'Arial',bold:true,sz:11,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'1B4D3E'}},alignment:{horizontal:'right',vertical:'center'}}));
    COLS.forEach((c,i)=>set(vatR,i,{font:{name:'Arial',bold:true,sz:11,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'2F6B57'}},alignment:{horizontal:'right',vertical:'center'}}));
    COLS.forEach((c,i)=>set(finalR,i,{font:{name:'Arial',bold:true,sz:13,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'12362B'}},alignment:{horizontal:'right',vertical:'center'}}));
    for(let r=noteStart;r<rows.length;r++)set(r,0,{font:{name:'Arial',sz:9,color:{rgb:'5B655F'}}});
    const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Bao gia');
    return X.write(wb,{type:'base64',bookType:'xlsx'});
  }
  async function saveQuote(existing){
    const name=($("#q_seller").value||"").trim();
    if(!name){$("#q_seller").focus();toast("Nhập tên khách hàng");return;}
    if(!db){toast("Chưa kết nối kho dữ liệu");return;}
    const lines=qActiveLines();
    if(!lines.length){toast("Chọn ít nhất 1 dịch vụ");return;}
    const badPct=lines.filter(l=>l.pct&&(l.rate>100||l.rate<0));
    if(badPct.length){toast("Tỷ lệ % của “"+badPct[0].label+"” phải từ 0–100 (VD 10 = 10%)");return;}
    const zero=lines.filter(l=>!l.pct&&!(l.price>0));
    if(zero.length&&!(await askYesNo("Còn hạng mục chưa có đơn giá",`${zero.map(l=>"<b>"+esc(l.label)+"</b>").join(", ")} đang có <b>đơn giá 0 đ</b> nên file sẽ ra 0 đ. Vẫn tạo file?`,"Vẫn tạo","Quay lại nhập giá")))return;
    const grandTotal=lines.reduce((a,l)=>a+l.subtotal,0);const vat=Math.round(grandTotal*0.08);
    const detailMode=($("#q_detail")||{}).value||"group",channel=($("#q_channel").value||"").trim(),revenue=($("#q_revenue").value||"").trim(),validDays=Number($("#q_valid").value)||15,note=($("#q_note").value||"").trim(),status=$("#q_status").value;
    const btn=$("[data-save]");btn.disabled=true;btn.textContent="Đang lưu…";
    try{
      const sellerId=await ensureSellerByName(name);
      let folderId=null;try{btn.textContent="Đang tạo folder…";folderId=await ensureSellerFolderId(sellerId,name);}catch(e){}
      let driveFileId="",driveFileLink="";
      if(mcp){
        try{
          btn.textContent="Đang xuất Sheet…";
          const base64=buildQuoteXlsxBase64({name,channel,revenue,validDays,note,lines,grandTotal,vat,detailMode});
          const title="Brand "+name+" | Báo giá dịch vụ";
          const args={title,contentMimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",base64Content:base64};
          if(folderId)args.parentId=folderId;else{const m=driveFolderId(settings.driveMasterLink||settings.driveMasterId||"");if(m)args.parentId=m;}
          btn.textContent="Đang lưu Drive…";
          const r=await mcp.callTool(DRIVE,"create_file",args);const f=r.payload||{};driveFileId=f.id||"";driveFileLink=f.viewUrl||"";
        }catch(e){toast("Lưu file Sheet lỗi: "+((e&&e.code)||"")+" — báo giá vẫn được lưu trong app");}
      }
      const now=new Date().toISOString();
      const data={sellerId,sellerName:name,detailMode,channel,revenue,validDays,note,selection:qSel,lines,grandTotal,vat,total:grandTotal+vat,status,updatedAt:now};
      if(driveFileId){data.driveFileId=driveFileId;data.driveFileLink=driveFileLink;}
      if(existing){await db.collection(QC).doc(existing.id).update(data);}
      else{data.createdAt=now;data.quoteNo="BG-"+String(quotes.length+1).padStart(4,"0");await db.collection(QC).doc(uid("q")).set(data);}
      closeOverlay();toast(driveFileLink?"Đã tạo báo giá + xuất Sheet vào folder khách":"Đã lưu báo giá");
    }catch(err){btn.disabled=false;btn.textContent=existing?"Lưu + xuất Sheet":"Tạo + xuất Sheet";toast(err&&err.code==="invalid_argument"?"Bạn không có quyền chỉnh sửa":"Lưu thất bại");}
  }

  // Read the first tab ("Tổng hợp") of the customer's ATS sheet as CSV: A1 = ATS_SUMMARY, B1 = JSON
  function b64utf8(b){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(u);}
  function csvFirstRow(t){const out=[];let cur="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===","){out.push(cur);cur="";}else if(ch==="\n"||ch==="\r"){break;}else cur+=ch;}}out.push(cur);return out;}
  async function refreshAts(s,silent){
    if(!mcp||!s.atsSheetId){if(!silent)toast("Chưa kết nối Google Drive");return;}
    atsBusy[s.id]=true;renderAll();syncOverlays();
    try{
      const r=await mcp.callTool(DRIVE,"download_file_content",{fileId:s.atsSheetId,exportMimeType:"text/csv"},{cache:false});
      const p=r.payload;let text=typeof p==="string"?p:(p&&(p.content||p.textContent))||"";
      if(text&&!/ATS_SUMMARY/.test(text)){try{text=b64utf8(text);}catch(e){}}
      const row=csvFirstRow(text.replace(/^﻿/,""));
      if(row[0]!=="ATS_SUMMARY")throw {code:"no_summary"};
      const sum=JSON.parse(row[1]);
      await db.collection(SC).doc(s.id).update({atsSummary:sum,atsSummaryAt:new Date().toISOString()});
      if(!silent)toast(sum.id===s.atsSheetId?"Đã cập nhật ATS – "+(s.name||""):"ATS của "+(s.name||"")+" chưa khởi tạo");
    }catch(err){if(!silent)toast(err&&err.code==="no_summary"?"Sheet chưa có tab Tổng hợp – hãy mở ATS một lần":driveErr(err).replace("Không tạo được folder","Không đọc được ATS"));}
    finally{delete atsBusy[s.id];renderAll();syncOverlays();}
  }

  async function fetchAtsSummary_(s){

    const p=r.payload;let text=typeof p==="string"?p:(p&&(p.content||p.textContent))||"";

  // Mở web app ATS đầy đủ bằng chính "Mã quản trị" RIÊNG của sheet khách (đọc qua connector) → không cần mã chung, không cần lưu
  let atsInfoCache={};
  async function atsSheetInfo_(s){
    if(atsInfoCache[s.atsSheetId])return atsInfoCache[s.atsSheetId];
    const r=await mcp.callTool(DRIVE,"read_file_content",{fileId:s.atsSheetId});
    const content=((r&&r.payload)||{}).fileContent||"";
    const mk=content.match(/Mã quản trị[\s\S]{0,60}?([0-9a-f]{40})/i)||content.match(/\b([0-9a-f]{40})\b/);
    const mc=content.match(/Sheet Name: Kênh[\s\S]*?sample data:\s*Tên kênh,\s*([^\n]+)/);
    const channels=mc?mc[1].split(",").map(x=>x.trim()).filter(x=>x&&x!=="_data"):[];
    const mp=content.match(/Mã dự án[\s|]*([-\w]{20,})/);
    const info={key:mk?mk[1]:"",channels:channels,pid:mp?mp[1]:""};
    atsInfoCache[s.atsSheetId]=info;return info;
  }

  async function openAtsWebApp(id,fallback){
    const s=sellerById(id)||fallback;if(!s)return;

    if(!mcp){toast("Chưa kết nối Google Drive trong claude.ai","err");return;}
    const w=window.open("about:blank","_blank");toast("Đang mở ATS…");
    try{
      const c=atsCfg(),base=(c.url||ATS_DEFAULT_URL).replace(/[?#].*$/,""),kind=sellerAtsKind(s);
      // Mã riêng của sheet khách – đọc mới mỗi lần (mã đổi khi khởi tạo)
      delete atsInfoCache[s.atsSheetId];
      let info={key:"",pid:""};try{info=await atsSheetInfo_(s);}catch(e){}
      // Ưu tiên mã quản trị chung (dùng được cho mọi sheet ATS) – đọc mã riêng của sheet qua Drive có thể sai khi sheet nhiều tab
      let key=c.key||info.key;
      // Bản sao vừa tạo chưa đọc được → dùng mã của sheet mẫu (bản sao chưa khởi tạo có cùng mã)
      if(!key){const tpl=kind==="lite"?c.liteTpl:c.tpl;if(tpl){try{delete atsInfoCache[tpl];key=(await atsSheetInfo_({atsSheetId:tpl})).key;}catch(e){}}}

      // Chưa khởi tạo = "Mã dự án" trong sheet khác ID của chính sheet → web tự làm sạch dữ liệu mẫu & đặt tên khách
      const needInit=info.pid?info.pid!==s.atsSheetId:!!(fallback&&fallback.atsSheetId);
      const link=key?base+"?p="+encodeURIComponent(s.atsSheetId)+"&k="+encodeURIComponent(key)+(needInit?"&init=1&name="+encodeURIComponent(s.name||""):""):atsSheetLink(s);

  async function syncServicesToAts(id,forcePackId,channel){
    const s=sellerById(id);if(!s)return;
    if(!s.atsSheetId){toast("Khách chưa có ATS — tạo ATS trước","err");return;}
    if(sellerAtsKind(s)==="lite"){toast("ATS Lite đã có sẵn checklist theo gói — không cần đồng bộ");return;}
    if(!mcp){toast("Chưa kết nối Google Drive","err");return;}
    let p=forcePackId?packById(forcePackId):(s.servicePackId?packById(s.servicePackId):null);
    if(!p){if(servicePacks.length===1)p=servicePacks[0];else{openPackPicker(id);return;}}
    if(!p){toast("Chưa có gói dịch vụ nào","err");return;}
    const items=(p.items||[]).map(x=>String(x||"").trim()).filter(Boolean);
    if(!items.length){toast("Gói chưa có hạng mục dịch vụ","err");return;}
    let info;
    try{toast("Đang đọc ATS…");info=await atsSheetInfo_(s);}catch(e){toast("Không đọc được ATS của khách","err");return;}
    if(!info.key){toast("Không đọc được mã ATS của khách","err");return;}
    if(channel===undefined){openChannelPicker(id,p.id,info.channels);return;}
    if(!(await askYesNo("Đồng bộ dịch vụ sang ATS",`Tạo <b>${items.length}</b> công việc trong ATS của <b>${esc(s.name||"")}</b> từ gói <b>${esc(p.name||"")}</b>${channel?` vào kênh <b>${esc(channel)}</b>`:""}? (Mục đã có sẽ bỏ qua; mục đã đồng bộ mà thiếu kênh sẽ được gán kênh này.)`,"Đồng bộ","Huỷ")))return;
    const w=window.open("about:blank","_blank");toast("Đang đồng bộ dịch vụ sang ATS…");
    try{
      const base=(atsCfg().url||ATS_DEFAULT_URL).replace(/[?#].*$/,"");
      const url=base+"?p="+encodeURIComponent(s.atsSheetId)+"&k="+encodeURIComponent(info.key)+"&importsvc=1&pack="+encodeURIComponent(p.name||"")+(channel?"&channel="+encodeURIComponent(channel):"")+"&items="+encodeURIComponent(JSON.stringify(items));
      if(w)w.location.href=url;else window.open(url,"_blank");
      toast("Đã mở tab đồng bộ");
    }catch(e){if(w)try{w.close();}catch(_){}toast("Lỗi đồng bộ dịch vụ","err");}
  }

  // ================= DASHBOARD (DỰ ÁN) =================
  const PCOL=["#0F766E","#B4690E","#2563EB","#7C3AED","#BE185D","#0891B2","#4D7C0F","#C13A2B"];
  function projColor(p,i){return p&&p.color?p.color:PCOL[i%PCOL.length];}
  function projStats(pid){
    const cs=pid==null?sellers.filter(s=>!s.projectId||!projectById(s.projectId)):sellersOfProject(pid);
    const ids=new Set(cs.map(s=>s.id));
    const ot=tasks.filter(t=>ids.has(t.sellerId)&&t.status!=="done").length;
    const qs=quotes.filter(q=>ids.has(q.sellerId));
    const accepted=qs.filter(q=>q.status==="accepted").reduce((a,q)=>a+(q.total||0),0);
    const pipeline=qs.reduce((a,q)=>a+(q.total||0),0);
    const stages={};Object.keys(STAGE).forEach(k=>stages[k]=0);cs.forEach(s=>{stages[stageOf(s)]=(stages[stageOf(s)]||0)+1;});
    return {customers:cs,openTasks:ot,quotes:qs.length,accepted,pipeline,stages};
  }
  // ----- Dự án lồng nhau -----
  function childProjects(pid){return projects.filter(p=>(p.parentId||"")===(pid||"")).sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi"));}
  function rootProjects(){return projects.filter(p=>!p.parentId||!projectById(p.parentId)).sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi"));}
  function descendantIds(pid){let ids=[pid];childProjects(pid).forEach(c=>{ids=ids.concat(descendantIds(c.id));});return ids;}
  function projStatsDeep(pid){
    const ids=new Set(descendantIds(pid));
    const cs=sellers.filter(s=>ids.has(s.projectId));
    const sids=new Set(cs.map(s=>s.id));
    const ot=tasks.filter(t=>sids.has(t.sellerId)&&t.status!=="done").length;
    const qs=quotes.filter(q=>sids.has(q.sellerId));
    const accepted=qs.filter(q=>q.status==="accepted").reduce((a,q)=>a+(q.total||0),0);
    return {customers:cs.length,openTasks:ot,quotes:qs.length,accepted};
  }
  function miniBars(data){

  }

  function projOptionRows(selId,excludeIds){

      if(excludeIds.indexOf(p.id)<0)out.push(`<option value="${p.id}" ${selId===p.id?"selected":""}>${"　".repeat(depth)}${depth?"└ ":""}${esc(p.name)}</option>`);
      walk(p.id,depth+1);
    });};
    walk("",0);
    return out.join("");
  }

  function projNodeHtml(p,depth){
    const col=projColor(p,projects.indexOf(p));
    const st=projStatsDeep(p.id);
    const kids=childProjects(p.id);
    const custs=sellersOfProject(p.id).slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi"));
    const inner=kids.map(k=>projNodeHtml(k,depth+1)).join("")
      +custs.map(s=>sellerTreeRow(s,p.id)).join("")
      +((kids.length||custs.length)?"":`<div class="tempty" style="padding:8px 4px">Chưa có mục con. Bấm “＋ khách” hoặc “＋ dự án con”.</div>`);
    const acts=`<span class="ptree-acts">
      ${p.zaloLink?`<a class="pt-act" href="${esc(normUrl(p.zaloLink))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Mở nhóm Zalo dự án" style="color:var(--zalo);border-color:color-mix(in srgb,var(--zalo) 35%,var(--border-strong))">💬 Zalo</a>`:""}
      <button class="pt-act" data-addcust="${p.id}" title="Thêm khách vào dự án">＋ khách</button>

    return `<div class="ptree-node">
      <div class="ptree-head">
        <button class="ctree-tog" data-exp="proj_${p.id}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <span class="tdot" style="background:${col}"></span>
        <span class="ptree-name">${esc(p.name)}${depth?'':' '}</span>
        <span class="ptree-meta">${st.customers} khách · ${st.openTasks} việc · ${st.quotes} báo giá · ${money(st.accepted)}</span>
        ${acts}
      </div>
      <div class="ptree-sub" id="sub-proj_${p.id}" hidden>${inner}</div>
    </div>`;
  }
  function sellerTreeRow(s,pid){
    const st=STAGE[stageOf(s)];
    const act=pid===null
      ? `<button class="pt-act" data-setproj="${s.id}" title="Xếp vào dự án" style="margin-left:8px">＋ xếp dự án</button>`
      : (pid?`<button class="pt-act" data-uncust="${s.id}" title="Gỡ khỏi dự án" style="margin-left:8px">gỡ</button>`:"");
    const leaves=[];
    const nt=tasksOf(s.id).length;if(nt)leaves.push(`<div class="ctree-leaf">✔️ Công việc: <b>${nt}</b> <span style="color:var(--muted)">(${openTasks(s.id)} chưa xong)</span></div>`);
    const nq=quotesOf(s.id).length;
    if(nq)leaves.push(`<div class="ctree-leaf">💰 Báo giá (công cụ): <b>${nq}</b></div>`);
    const qh=s.quoteDriveLink?esc(s.quoteDriveLink):(s.quoteFileId?"/_blob/"+esc(s.quoteFileId):(s.quoteLink?esc(normUrl(s.quoteLink)):""));
    if(qh)leaves.push(`<a class="ctree-leaf lk" href="${qh}" target="_blank" rel="noopener" onclick="event.stopPropagation()">💰 Báo giá (đính kèm) ↗</a>`);
    const bh=s.briefDriveLink?esc(s.briefDriveLink):(s.briefId?"/_blob/"+esc(s.briefId):(s.briefLink?esc(normUrl(s.briefLink)):""));
    if(bh)leaves.push(`<a class="ctree-leaf lk" href="${bh}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📁 Brief ↗</a>`);
    const ph=s.planDriveLink?esc(s.planDriveLink):(s.planFileId?"/_blob/"+esc(s.planFileId):(s.planLink?esc(normUrl(s.planLink)):""));
    if(ph)leaves.push(`<a class="ctree-leaf lk" href="${ph}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🗺️ Plan ↗</a>`);
    if(s.requirement||s.reqFileName)leaves.push(`<div class="ctree-leaf">📝 Yêu cầu${s.reqFileName?" (có file)":""}</div>`);
    const leafHtml=leaves.length?leaves.join(""):`<div class="ctree-leaf" style="color:var(--muted)">Chưa có mục nào</div>`;
    return `<div class="ctree-item">
      <div class="ctree-head">
        <button class="ctree-tog" data-exp="${s.id}" aria-label="Mở rộng"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <span class="ctree-name" data-detail="${s.id}">${esc(s.name||"—")}</span>
        <span class="stage-badge" style="background:${st.bg};color:${st.c};margin-left:auto;flex:none">${st.l}</span>${act}
      </div>
      <div class="ctree-sub" id="sub-${s.id}" hidden>${leafHtml}</div>
    </div>`;
  }

    const tg=e.target.closest("[data-toggle]");if(tg){e.stopPropagation();cycleStatus(tg.getAttribute("data-toggle"));return;}

    const qsd=e.target.closest("[data-quotesend]");if(qsd){e.stopPropagation();openQuoteSend(quotes.find(x=>x.id===qsd.getAttribute("data-quotesend")));return;}

  function composeNote(s){
    const L=[];L.push("📌 KHÁCH: "+(s.name||"—"));
    if(s.role)L.push("🔑 "+s.role);
    if(s.note)L.push("📝 "+s.note);
    if(s.phone)L.push("📞 "+s.phone);
    const z=s.zalo||s.phone;if(z)L.push("💬 Zalo: "+z);
    if(s.email)L.push("✉️ "+s.email);
    if(s.sales)L.push("—\n"+s.sales);
    return L.join("\n");
  }
  function composeTask(t){
    const s=sellerById(t.sellerId);
    const L=[];L.push("🔔 CÔNG VIỆC"+(t.priority==="high"?" ⚡ƯU TIÊN":""));
    L.push("• "+(t.title||""));
    const who=s?s.name:(t.sellerName||"");if(who)L.push("👤 Khách: "+who);
    L.push("📌 Trạng thái: "+((ST[t.status]&&ST[t.status].l)||t.status||""));
    if(t.due)L.push("📅 Hạn: "+fmtDate(t.due)+(isOver(t.due,t.status)?" (đã trễ)":""));
    if(t.detail)L.push("📝 "+t.detail);
    taskLinks(t).forEach(l=>L.push("🔗 "+(l.label?l.label+": ":"")+l.url));
    if(s&&s.phone)L.push("📞 "+s.phone);
    const z=s&&(s.zalo||s.phone);if(z)L.push("💬 Zalo: "+z);
    return L.join("\n");
  }

  function prodColKeys_(){return {
    id:['id sản phẩm','product_id','product id','mã sản phẩm'],
    ten:['tên sản phẩm','ten san pham','tên sp','product name','tên','ten'],
    phanLoai:['phân loại','phan loai','category','ngành','nganh'],
    giaNiemYet:['giá niêm','gia niem','giá gốc','gia goc','list price','original price','giá liệt kê'],
    giaHienTai:['giá hiện tại','gia hien tai','giá bán','gia ban','sale price','giá','price'],
    pctGiam:['% giảm','% giam','giảm giá','giam gia','discount'],
    qua:['quà','qua tang','gift'],
    link:['link sản phẩm','link san pham','link','url'],
    chatLieu:['chất liệu','chat lieu','material'],
    moTa:['mô tả','mo ta','description','desc'],
    usp:['usp','điểm khác biệt','khac biet'],
    anh:['hình ảnh','hinh anh','ảnh','anh','image','photo','thumbnail']
  };}
  function findProdHeader_(aoa){
    const KEYS=prodColKeys_();
    for(let r=0;r<Math.min(aoa.length,20);r++){
      const row=(aoa[r]||[]).map(x=>String(x==null?"":x).toLowerCase().trim());
      if(row.some(c=>/t[eê]n s[aả]n ph[aẩ]m|product name|^t[eê]n$/.test(c))){
        const map={};Object.keys(KEYS).forEach(k=>{map[k]=-1;
          for(let i=0;i<row.length;i++){if(KEYS[k].some(kw=>row[i].indexOf(kw)>=0)){map[k]=i;break;}}});
        return {headerRow:r,map};
      }
    }
    return null;
  }
  function stripHtml_(s){return String(s||"")
    .replace(/<\s*li[^>]*>/gi,"\n• ")
    .replace(/<\s*(br|\/p|\/div|\/h\d|\/tr|\/ul|\/ol)\s*\/?>/gi,"\n")
    .replace(/<[^>]+>/g," ")
    .replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/&lt;/gi,"<").replace(/&gt;/gi,">").replace(/&#39;|&#x27;/gi,"'").replace(/&quot;/gi,'"')
    .replace(/[ \t]+/g," ")
    .replace(/[ \t]*\n[ \t]*/g,"\n")
    .replace(/\n{3,}/g,"\n\n")
    .trim();}
  const PROD_META=["bắt buộc","không bắt buộc","bắt buộc có điều kiện","không thể chỉnh sửa","tên sản phẩm","metric","tùy chọn"];
  function rowsToProducts_(aoa,hr){
    const m=hr.map,out=[],g=(row,i)=>i>=0?String(row[i]==null?"":row[i]).trim():"";
    for(let r=hr.headerRow+1;r<aoa.length;r++){
      const row=aoa[r]||[],ten=g(row,m.ten);if(!ten)continue;
      const tl=ten.toLowerCase();
      if(PROD_META.some(w=>tl===w||tl.indexOf("tên sản phẩm")===0))continue; // bỏ dòng meta/hướng dẫn
      let pid="";
      if(m.id>=0){pid=g(row,m.id);if(!/\d{5,}/.test(pid))continue;} // có cột ID: chỉ lấy dòng có ID thật
      let link=g(row,m.link);
      if(!link&&/^\d{15,}$/.test(pid))link="https://shop.tiktok.com/view/product/"+pid; // export TikTok không có cột link → tạo từ ID
      out.push({ten,pid,phanLoai:g(row,m.phanLoai),giaNiemYet:g(row,m.giaNiemYet),giaHienTai:g(row,m.giaHienTai),giamToiDa:"",pctGiam:g(row,m.pctGiam),qua:g(row,m.qua),link,chatLieu:g(row,m.chatLieu),moTa:stripHtml_(g(row,m.moTa)).slice(0,600),usp:g(row,m.usp),anh:g(row,m.anh)});
    }
    return out;
  }
  function fullRange_(ws){
    // TikTok/Shopee export hay khai báo !ref thiếu dòng → tự tính lại range từ các ô thật
    let r=XLSX.utils.decode_range(ws['!ref']||'A1');
    Object.keys(ws).forEach(k=>{if(k[0]==='!')return;const c=XLSX.utils.decode_cell(k);
      if(c.r>r.e.r)r.e.r=c.r;if(c.c>r.e.c)r.e.c=c.c;if(c.r<r.s.r)r.s.r=c.r;if(c.c<r.s.c)r.s.c=c.c;});
    return XLSX.utils.encode_range(r);
  }
  function parseProductsFromWb_(wb){
    let best=null,bestScore=-1;
    wb.SheetNames.forEach(nm=>{
      const ws=wb.Sheets[nm];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",range:fullRange_(ws)});
      const hr=findProdHeader_(aoa);
      if(hr){const score=Object.keys(hr.map).reduce((a,k)=>a+(hr.map[k]>=0?1:0),0);if(score>bestScore){bestScore=score;best={aoa,hr};}}
    });
    return best?rowsToProducts_(best.aoa,best.hr):[];
  }
  async function importProductsFile(existing,files){
    if(!existing){toast("Lưu seller trước rồi nhập sản phẩm");return;}
    if(!files||!files.length)return;const out=$("#prodFileOut");if(!out)return;
    if(typeof XLSX==="undefined"){out.innerHTML='<div class="hint" style="color:var(--danger)">Thư viện Excel chưa tải xong, thử lại.</div>';return;}
    out.innerHTML='<div class="hint">Đang đọc '+files.length+' file…</div>';
    try{
      let added=[],bad=0;
      for(const f of files){
        try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});const ps=parseProductsFromWb_(wb);if(ps.length)added=added.concat(ps);else bad++;}
        catch(e){bad++;}
      }
      if(!added.length){out.innerHTML='<div class="hint" style="color:var(--danger)">Không đọc được sản phẩm nào (kiểm tra dòng tiêu đề có cột "Tên sản phẩm").</div>';return;}
      if(!db){toast("Chưa kết nối kho dữ liệu");return;}
      const cur=sellerById(existing.id)||existing;
      const base=(cur.products||[]).slice();
      const seen={};base.forEach(p=>{seen[((p.ten||"")+"|"+(p.link||"")).toLowerCase().trim()]=1;});
      let newCount=0;
      added.forEach(p=>{const k=((p.ten||"")+"|"+(p.link||"")).toLowerCase().trim();if(k==="|")return;if(!seen[k]){seen[k]=1;base.push(p);newCount++;}});
      await db.collection(SC).doc(existing.id).update({products:base,prodSyncAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
      out.innerHTML=`<div class="hint" style="color:var(--green)">✅ Đã thêm ${newCount} sản phẩm mới (tổng ${base.length}).${bad?" "+bad+" file không đọc được.":""} Mở chi tiết khách để xem.</div>`;
      const fi=$("#prodFile");if(fi)fi.value="";
    }catch(e){out.innerHTML='<div class="hint" style="color:var(--danger)">Lỗi đọc file: '+esc(String(e&&e.message||e))+'</div>';}
  }

      const newPack=data.servicePackId&&data.servicePackId!==((existing&&existing.servicePackId)||"")?packById(data.servicePackId):null;

        ensureSellerFolderId(newId,data.name).then(id=>{if(id)toast("Đã gắn folder Drive cho khách");});

      toast(err&&err.code==="invalid_argument"?"Bạn không có quyền chỉnh sửa":"Lưu thất bại, thử lại");}
  }

  async function saveTask(existing){

  // ================= GOOGLE DRIVE =================
  const DRIVE="Google Drive";
  function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result||"");res(s.slice(s.indexOf(",")+1));};r.onerror=rej;r.readAsDataURL(file);});}
  async function saveSellerFile(sid,name,pending,f){
    if(pending.file){
      let link="",fid="";
      try{
        if(mcp){const fldr=await ensureSellerFolderId(sid,name);
          if(fldr){const b64=await fileToB64(pending.file);
            const r=await mcp.callTool(DRIVE,"create_file",{title:pending.file.name,contentMimeType:pending.file.type||"application/octet-stream",base64Content:b64,parentId:fldr});
            link=(r.payload||{}).viewUrl||"";}}
        if(!link&&assets){const up=await assets.upload(pending.file);fid=up.id;}
        const u={};u[f.drive]=link;u[f.id]=fid;u[f.nm]=pending.file.name;u.updatedAt=new Date().toISOString();
        await db.collection(SC).doc(sid).update(u);
      }catch(e){toast("Tải file lỗi: "+((e&&e.code)||""));}
    }else if(pending.remove){const u={};u[f.drive]="";u[f.id]="";u[f.nm]="";u.updatedAt=new Date().toISOString();try{await db.collection(SC).doc(sid).update(u);}catch(e){}}
  }
  function driveFolderId(link){link=(link||"").trim();let m=link.match(/\/folders\/([-\w]+)/)||link.match(/[?&]id=([-\w]+)/)||link.match(/\/drive\/u\/\d+\/folders\/([-\w]+)/);return m?m[1]:(/^[-\w]{20,}$/.test(link)?link:"");}
  function driveErr(err){const c=err&&err.code;
    if(c==="server_not_connected")return"Chưa kết nối Google Drive. Vào claude.ai → Settings → Connectors để thêm.";
    if(c==="needs_reauth")return"Kết nối Google Drive hết hạn, hãy kết nối lại trong claude.ai → Settings → Connectors.";
    if(c==="not_in_manifest")return"Google Drive chưa được cấp quyền cho trang này.";
    if(c==="tool_error")return"Google Drive báo lỗi: "+((err&&err.message)||"");
    return "Không tạo được folder ("+(c||"lỗi")+")";}
  async function ensureSellerFolder(s,silent){
    const master=driveFolderId(settings.driveMasterLink||settings.driveMasterId||"");
    if(!master){if(!silent){toast("Chưa cấu hình folder tổng — mở ⚙️ Cài đặt");openSettings();}return null;}
    if(!mcp){if(!silent)toast("Chưa kết nối Google Drive trong claude.ai");return null;}
    try{
      // tìm folder trùng tên trước
      let id="",url="";
      try{
        const q="title = '"+(s.name||"").replace(/'/g,"\\'")+"' and mimeType = 'application/vnd.google-apps.folder' and parentId = '"+master+"'";
        const sr=await mcp.callTool(DRIVE,"search_files",{query:q,pageSize:1});
        const files=(sr.payload&&(sr.payload.files||sr.payload.data))||[];
        if(files.length){id=files[0].id;url=files[0].viewUrl||("https://drive.google.com/drive/folders/"+id);}
      }catch(e){}
      if(!id){
        const r=await mcp.callTool(DRIVE,"create_file",{title:s.name||"Khách",parentId:master,mimeType:"application/vnd.google-apps.folder"});
        const f=r.payload||{};id=f.id;url=f.viewUrl||("https://drive.google.com/drive/folders/"+id);
      }
      if(id){await db.collection(SC).doc(s.id).update({driveFolderId:id,driveFolderLink:url,updatedAt:new Date().toISOString()});if(!silent)toast("Đã tạo/gắn folder Drive");return url;}
    }catch(err){if(!silent)toast(driveErr(err));}
    return null;
  }

  /* ===== Brief sản phẩm: bấm "Tạo brief" → sao chép mẫu vào folder Drive của khách (mỗi khách 1 lần) ===== */
  const BRIEF_TPL_ID="1tOLZUoFyd0b3MD_T1nhc5cDSKgrO391Tj4ZSxDOXNc8"; // "Brief | Product | Video – Mẫu (ATS, không xoá)"
  const BRIEF_ICON=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>`;
  const briefBusy={};
  function briefUrlOf(s){return s.briefLink?normUrl(s.briefLink):(s.briefDriveLink||"");}
  function briefAct(s){
    const u=briefUrlOf(s);
    if(u)return `<a class="act brief" href="${esc(u)}" target="_blank" rel="noopener" title="Mở brief sản phẩm của khách">${BRIEF_ICON}Brief</a>`;
    if(briefBusy[s.id])return `<button class="act brief mk" disabled title="Đang tạo brief…">${BRIEF_ICON}Đang tạo…</button>`;
    return `<button class="act brief mk" data-createbrief="${esc(s.id)}" title="Sao chép mẫu Brief vào folder Drive của khách">${BRIEF_ICON}Tạo brief</button>`;
  }
  async function briefFind(folder){
    try{const sr=await mcp.callTool(DRIVE,"search_files",{query:"parentId = '"+folder+"' and title contains 'Brief' and trashed = false",pageSize:5});
      const f=((sr.payload&&(sr.payload.files||sr.payload.data))||[]).filter(x=>x&&x.id&&!/folder/.test(x.mimeType||""))[0];
      return f?{id:f.id,url:f.viewUrl||("https://drive.google.com/open?id="+f.id)}:null;}catch(e){return null;}
  }
  async function briefSave(s,url,created){
    await db.collection(SC).doc(s.id).update({briefLink:url,briefCreatedAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    toast(created?"Đã tạo brief trong folder của "+(s.name||"khách"):"Khách đã có brief trong folder – đã gắn link");
  }
  async function createBrief(s,btn){
    const cur=briefUrlOf(s);if(cur){window.open(cur,"_blank","noopener");return;}
    if(briefBusy[s.id])return;
    if(!mcp){toast("Chưa kết nối Google Drive trong claude.ai","err");return;}
    briefBusy[s.id]=true;const old=btn?btn.innerHTML:"";if(btn){btn.disabled=true;btn.innerHTML=BRIEF_ICON+"Đang tạo…";}
    const done=()=>{delete briefBusy[s.id];if(btn&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=old;}};
    try{
      let folder=s.driveFolderId||"";
      if(!folder)folder=await ensureSellerFolderId(s.id,s.name,false)||"";
      if(!folder){toast("Cần folder Drive của khách để đặt brief","err");return done();}
      const had=await briefFind(folder);
      if(had){await briefSave(s,had.url,false);return done();}
      const tpl=settings.briefTplId||BRIEF_TPL_ID;
      try{
        const r=await mcp.callTool(DRIVE,"copy_file",{fileId:tpl,title:"Brief | Product | Video · "+(s.name||"Khách"),parentId:folder});
        const f=r.payload||{};if(!f.id)throw {code:"tool_error",message:"Không nhận được ID file brief"};
        await briefSave(s,f.viewUrl||("https://docs.google.com/spreadsheets/d/"+f.id+"/edit"),true);return done();
      }catch(err){
        // Gmail đang dùng không đọc được file mẫu → nhờ ATS (chạy dưới tên chủ Drive) tạo hộ qua phiếu
        const folderQ=await pqFolder();
        const job={v:1,from:"Seller Network",at:new Date().toISOString(),ops:[{op:"brief",folderId:folder,name:s.name||"Khách",seller:s.id}]};
        const w=await mcp.callTool(DRIVE,"create_file",{title:"pq-"+Date.now()+".json",parentId:folderQ,contentMimeType:"application/json",base64Content:b64enc(JSON.stringify(job)),disableConversionToGoogleType:true});
        const fid=(w.payload||{}).id;if(!fid)throw err;
        toast("Đang tạo brief qua ATS – tối đa 5 phút"+(pqSyncUrl()?" (hoặc bấm ⟳ Đồng bộ ngay ở tab Nhân sự)":""));
        renderAll();briefWait(s.id,fid,0);
      }
    }catch(err){toast((err&&err.msg)||driveErr(err).replace("Không tạo được folder","Không tạo được brief"),"err");done();renderAll();}
  }
  async function briefWait(sid,fid,n){
    if(n>24){delete briefBusy[sid];renderAll();toast("ATS chưa xử lý yêu cầu tạo brief – thử lại sau","err");return;}
    setTimeout(async()=>{
      try{const r=await mcp.callTool(DRIVE,"download_file_content",{fileId:fid},{cache:false});const p=r.payload;let t=typeof p==="string"?p:(p&&(p.content||p.textContent))||"";
        if(t&&String(t).trim()[0]!=="{"){try{t=b64utf8(t);}catch(e){}}
        const j=JSON.parse(String(t).replace(/^﻿/,""));const res=Array.isArray(j.results)&&j.results[0];
        if(res){delete briefBusy[sid];const s=sellerById(sid);
          if(res.ok&&res.briefUrl&&s)await briefSave(s,res.briefUrl,true);else toast("Không tạo được brief: "+((res.steps||[]).join(" · ")||"lỗi"),"err");
          renderAll();return;}
      }catch(e){}
      briefWait(sid,fid,n+1);
    },15000);
  }

  // ================= EXCEL =================
  const XCOLS=[["name","Tên"],["role","Vai trò / Quyền"],["phone","SĐT"],["zalo","Zalo"],["email","Email"],["note","Ghi chú"],["sales","Thông tin bán hàng"],["adsLink","Link Ads"],["channelLink","Link kênh"],["briefLink","Link brief"],["driveFolderLink","Link folder Drive"],["briefName","Tên file brief"],["chromeProfile","Profile Chrome"]];
  function fieldOfHeader(h){h=(h||"").toString().toLowerCase().trim();
    if(!h)return null;
    if(/(chrome|profile)/.test(h))return"chromeProfile";
    if(/(vai\s*tr|quy[eề]n)/.test(h))return"role";
    if(/(t[eê]n)/.test(h)&&!/(file|brief)/.test(h))return"name";
    if(/(s[đd]t|đi[eệ]n\s*tho|phone|di dong)/.test(h))return"phone";
    if(/zalo/.test(h))return"zalo";
    if(/(email|e-mail|mail)/.test(h))return"email";
    if(/(ghi\s*ch|note)/.test(h))return"note";
    if(/(b[aá]n\s*h[aà]ng|doanh|sales)/.test(h))return"sales";
    if(/ads/.test(h))return"adsLink";
    if(/brief/.test(h)&&/link/.test(h))return"briefLink";
    if(/brief/.test(h))return"briefName";
    if(/(folder|drive)/.test(h))return"driveFolderLink";
    if(/(k[eê]nh|channel|shop)/.test(h))return"channelLink";
    return null;
  }

  function sheetFromSellers(rows){
    const aoa=[XCOLS.map(c=>c[1])];
    rows.forEach(s=>aoa.push(XCOLS.map(c=>s[c[0]]||"")));
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"]=XCOLS.map(c=>({wch:c[0]==="note"||c[0]==="sales"?28:c[0]==="name"?20:16}));
    return ws;
  }
  async function saveXlsx(ws,filename){
    if(typeof XLSX==="undefined"){toast("Thư viện Excel chưa tải xong, thử lại");return;}
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Sellers");
    const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    if(!dl){toast("Tải xuống không khả dụng ở chế độ xem này");return;}
    try{await dl.save({filename,data:buf});toast("Đã xuất "+filename);}
    catch(err){if(err&&err.code==="declined")return;toast("Xuất file thất bại: "+(err&&err.code||""));}
  }
  function exportXlsx(){
    if(sellers.length===0){toast("Chưa có seller để xuất");return;}
    const rows=sellers.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi"));
    saveXlsx(sheetFromSellers(rows),"seller-network.xlsx");
  }

    closeOverlay();const ov=el("div","overlay");ov.id="overlay";

    $("#tplBtn").onclick=buildTemplate;
    let parsed=[];
    $("#impFile").onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=ev=>{
        try{
          const wb=XLSX.read(ev.target.result,{type:"array"});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
          if(!aoa.length){$("#impInfo").textContent="File trống.";return;}
          const heads=aoa[0].map(fieldOfHeader);
          if(heads.indexOf("name")<0){$("#impInfo").innerHTML='<span style="color:var(--danger)">Không tìm thấy cột “Tên”. Kiểm tra dòng tiêu đề.</span>';return;}
          parsed=[];
          for(let i=1;i<aoa.length;i++){const r=aoa[i];const o={};heads.forEach((fld,j)=>{if(fld&&fld!=="briefName")o[fld]=(r[j]==null?"":String(r[j])).trim();});if(o.name)parsed.push(o);}
          $("#impInfo").innerHTML=parsed.length?`Đã đọc <b>${parsed.length}</b> seller hợp lệ. Bấm “Nhập dữ liệu”.`:'<span style="color:var(--danger)">Không có dòng nào có Tên.</span>';
          $("#impGo").disabled=!parsed.length;
        }catch(err){$("#impInfo").innerHTML='<span style="color:var(--danger)">Không đọc được file. Đảm bảo đúng định dạng Excel/CSV.</span>';}
      };
      rd.readAsArrayBuffer(f);
    };
    $("#impGo").onclick=async()=>{
      if(!db){toast("Chưa kết nối kho dữ liệu");return;}
      if(!parsed.length)return;
      const btn=$("#impGo");btn.disabled=true;let ok=0;
      for(const o of parsed){
        const now=new Date().toISOString();
        try{await db.collection(SC).doc(uid("s")).set(Object.assign({name:"",role:"",phone:"",zalo:"",email:"",note:"",sales:"",adsLink:"",channelLink:"",createdAt:now,updatedAt:now},o));ok++;btn.textContent="Đang nhập… "+ok+"/"+parsed.length;}
        catch(err){}
      }
      closeOverlay();toast("Đã nhập "+ok+" seller");
    };
  }

  function catInput(e){
    const t=e.target;const f=t.dataset&&t.dataset.f;if(!f)return;
    const g=catDraft[+t.dataset.g];if(!g)return;
    if(t.dataset.i!=null){const it=g.items[+t.dataset.i];if(!it)return;
      if(t.type==="checkbox")it[f]=t.checked;else if(CAT_NUM.includes(f))it[f]=Math.max(0,Number(t.value)||0);else it[f]=t.value;}
    else if(f==="bullets")g.bullets=t.value.split("\n").map(x=>x.trim()).filter(Boolean);
    else g[f]=t.value;
    setCatDirty(true);
    if(t.hasAttribute("data-redraw"))drawCat();
  }
  function catClick(e){
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.gmove!=null){const i=+b.dataset.gmove,j=i+(+b.dataset.d);if(j<0||j>=catDraft.length)return;[catDraft[i],catDraft[j]]=[catDraft[j],catDraft[i]];}
    else if(b.dataset.gdel!=null){catDraft.splice(+b.dataset.gdel,1);}
    else if(b.dataset.iadd!=null){catDraft[+b.dataset.iadd].items.push({id:uid("i"),label:"",unit:"đ/tháng",min:0,max:0,def:0,qtyLabel:"Số lượng",qtyDef:1,recurring:false});}
    else if(b.dataset.idel!=null){catDraft[+b.dataset.idel].items.splice(+b.dataset.i,1);}
    else if(b.hasAttribute("data-gadd")){const n=String(catDraft.length+1).padStart(2,"0");catDraft.push({code:n,title:"",subtitle:"",bullets:[],items:[{id:uid("i"),label:"",unit:"đ/tháng",min:0,max:0,def:0,qtyLabel:"Số tháng",qtyDef:1,recurring:true}]});}
    else return;
    setCatDirty(true);drawCat();
  }
  async function saveCatalog(){
    const codes=new Set();
    for(const g of catDraft){
      g.code=String(g.code||"").trim();g.title=String(g.title||"").trim();
      if(!g.code||!g.title){toast("Mỗi nhóm cần Mã và Tên");return;}
      if(codes.has(g.code)){toast("Mã nhóm bị trùng: "+g.code);return;}codes.add(g.code);
      g.bullets=g.bullets||[];g.items=(g.items||[]).filter(it=>String(it.label||"").trim());
      if(!g.items.length){toast("Nhóm “"+g.title+"” cần ít nhất 1 hạng mục có tên");return;}
      g.items.forEach(it=>{if(!it.id)it.id=uid("i");it.label=String(it.label).trim();it.recurring=!!it.recurring;it.freeform=!!it.freeform;it.pct=!!it.pct;if(it.pct&&!it.pctBase)it.pctBase="group";CAT_NUM.forEach(k=>it[k]=Number(it[k])||0);});
    }
    if(!catDraft.length){toast("Cần ít nhất 1 nhóm dịch vụ");return;}
    if(!db){toast("Chưa kết nối kho dữ liệu");return;}
    const btn=$("#catSave");btn.disabled=true;btn.textContent="Đang lưu…";
    try{await db.collection("settings").doc("catalog").set({groups:catDraft,updatedAt:new Date().toISOString()});
      CATALOG=clone(catDraft);setCatDirty(false);drawCat();toast("Đã lưu danh mục dịch vụ");}
    catch(err){toast(err&&err.code==="invalid_argument"?"Bạn không có quyền chỉnh sửa":"Lưu thất bại");}
    btn.disabled=false;btn.textContent="Lưu danh mục";
  }

  function buildServiceWorkbook(pack,sellerName){

    (pack.items||[]).forEach((it,i)=>a1.push([i+1,it,"",""]));

  // ==================== LỊCH (lịch hẹn + hạn công việc + hạn báo giá) ====================

  if(!calView)calView=(window.matchMedia&&window.matchMedia("(max-width:760px)").matches)?"agenda":"month";
  const EV_T={meet:{l:"Gặp trực tiếp",i:"🤝"},call:{l:"Gọi điện",i:"📞"},online:{l:"Họp online",i:"💻"},other:{l:"Khác",i:"📌"}};
  const WD=["T2","T3","T4","T5","T6","T7","CN"];
  function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function isoYmd(v){if(!v)return"";if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const d=new Date(v);return isNaN(d)?"":ymd(d);}
  function pday(s){const p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function quoteExp(q){const c=isoYmd(q.createdAt);return c?ymd(addDays(pday(c),+q.validDays||15)):"";}
  function calItems(){
    const out=[];
    if(calShow.ev)events.forEach(e=>{if(e.date)out.push({k:"ev",id:e.id,date:e.date,time:e.start||"",title:e.title||"Lịch hẹn",sid:e.sellerId,done:!!e.done,src:e});});

    const ko={ev:0,task:1,quote:2};
    return out.sort((a,b)=>(a.time||"99")<(b.time||"99")?-1:(a.time||"99")>(b.time||"99")?1:ko[a.k]-ko[b.k]);
