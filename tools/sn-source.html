  function staffActive(m){return m&&m.active!==false;}
  function sellersOfStaff(id){return sellers.filter(s=>(s.staffIds||[]).indexOf(id)>=0);}
  function accList(s){const a=s.staffAccess||{};return Object.keys(a).map(id=>Object.assign({id},a[id])).filter(x=>x.status!=="gone");}
  const ACC={ok:["✓ Đã cấp quyền","ok"],pending:["⏳ Đang cấp","wait"],err:["⚠ Lỗi","err"]};
  function accBadge(a){
    if(!a)return `<span class="pq-b idle">Chưa cấp</span>`;
    const k=a.op==="revoke"?(a.status==="err"?["⚠ Thu hồi lỗi","err"]:["⏳ Đang thu hồi","wait"]):(ACC[a.status]||["?","idle"]);
    const old=a.status==="pending"&&a.at&&Date.now()-new Date(a.at).getTime()>8*60e3;
    return `<span class="pq-b ${k[1]}" title="${esc((a.msg||"")+(old?" · Chờ lâu – bấm Đồng bộ ngay":""))}">${k[0]}${old?" (chờ lâu)":""}</span>`;
  }
  function b64enc(str){const u=new TextEncoder().encode(str);let b="";for(let i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b);}
  function pqSyncUrl(){const u=(settings.atsWebUrl||"").replace(/[?#].*$/,"");return u?u+"?act=sync":"";}
  async function pqFolder(){
    if(settings.pqFolderId)return settings.pqFolderId;
    const master=settings.driveMasterId;if(!master)throw {msg:"Chưa đặt thư mục Drive gốc trong Cài đặt"};
    let id="";
    try{const sr=await mcp.callTool(DRIVE,"search_files",{query:"title = '"+PQ_FOLDER+"' and mimeType = 'application/vnd.google-apps.folder' and parentId = '"+master+"'",pageSize:1});
      const f=(sr.payload&&(sr.payload.files||sr.payload.data))||[];if(f.length)id=f[0].id;}catch(e){}
    if(!id){const r=await mcp.callTool(DRIVE,"create_file",{title:PQ_FOLDER,parentId:master,mimeType:"application/vnd.google-apps.folder"});id=(r.payload||{}).id||"";}
    if(!id)throw {msg:"Không tạo được thư mục hàng đợi phân quyền trên Drive"};
    try{await db.collection("settings").doc("app").update({pqFolderId:id});}catch(e){}
    settings.pqFolderId=id;return id;
  }
  // So sánh "nhân sự được giao" với "quyền đã cấp" của từng khách → tạo phiếu grant / revoke
  async function staffSync(ids,opt){
    opt=opt||{};
    if(!db)return;
    if(!mcp){toast("Chưa kết nối Google Drive – chưa cấp/thu hồi quyền được","err");return;}
    const now=new Date().toISOString(),ops=[],upd={};
    ids.forEach(sid=>{
      const s=sellerById(sid);if(!s)return;
      const acc=JSON.parse(JSON.stringify(s.staffAccess||{}));let ch=false;
      const base={folderId:s.driveFolderId||"",sheetId:s.atsSheetId||"",seller:s.id,sellerName:s.name||""};
      const want=(s.staffIds||[]).filter(id=>{const m=staffById(id);return staffActive(m)&&m.email;});
      want.forEach(id=>{
        const m=staffById(id),em=String(m.email).trim().toLowerCase(),a=acc[id];
        const lv=staffLevel(m);
        const need=opt.force||!a||a.status==="gone"||a.op==="revoke"||a.email!==em||(a.status==="err")||(a.role||"Nhân viên")!==lv;
        if(!need)return;
        if(a&&a.email&&a.email!==em&&a.status!=="gone")ops.push(Object.assign({op:"revoke",email:a.email,name:a.name||""},base));
        if(!base.folderId&&!base.sheetId){acc[id]={email:em,name:m.name||"",op:"grant",status:"err",msg:"Khách chưa có folder Drive / sheet ATS",at:now};ch=true;return;}
        ops.push(Object.assign({op:"grant",email:em,name:m.name||"",role:lv,notify:opt.notify!==false&&!(a&&a.status==="ok"&&a.email===em&&(a.role||"Nhân viên")===lv)},base));
        acc[id]={email:em,name:m.name||"",role:lv,op:"grant",status:"pending",at:now};ch=true;
      });
      Object.keys(acc).forEach(id=>{
        if(want.indexOf(id)>=0)return;const a=acc[id];
        if(a.status==="gone"||(a.op==="revoke"&&a.status==="pending"&&!opt.force))return;
        if(a.op==="grant"&&a.status==="err"&&!a.job){acc[id]=Object.assign({},a,{status:"gone"});ch=true;return;}
        ops.push(Object.assign({op:"revoke",email:a.email,name:a.name||""},base));
        acc[id]=Object.assign({},a,{op:"revoke",status:"pending",at:now,msg:""});ch=true;
      });
      if(ch)upd[sid]=acc;
    });
    if(!Object.keys(upd).length){if(!opt.quiet)toast("Quyền đã khớp – không có gì cần cập nhật");return;}
    let fid="";
    if(ops.length){
      try{
        const folder=await pqFolder();
        const job={v:1,from:"Seller Network",at:now,ops};
        const r=await mcp.callTool(DRIVE,"create_file",{title:"pq-"+Date.now()+".json",parentId:folder,contentMimeType:"application/json",base64Content:b64enc(JSON.stringify(job)),disableConversionToGoogleType:true});
        fid=(r.payload||{}).id||"";if(!fid)throw {msg:"Không ghi được phiếu phân quyền"};
      }catch(e){toast((e&&e.msg)||driveErr(e),"err");return;}
    }
    for(const sid of Object.keys(upd)){const acc=upd[sid];Object.keys(acc).forEach(k=>{if(acc[k].status==="pending"&&acc[k].at===now)acc[k].job=fid;});
      try{await db.collection(SC).doc(sid).update({staffAccess:acc,updatedAt:now});}catch(e){}}
    if(ops.length&&!opt.quiet)toast("Đã gửi "+ops.length+" yêu cầu phân quyền – hệ thống xử lý trong vòng 5 phút");
    setTimeout(pqPoll,4000);
  }
  // Đọc kết quả từ phiếu (script ATS ghi results vào chính file)
  async function pqPoll(){
    clearTimeout(pqTimer);pqTimer=null;
    if(!mcp||!db||pqBusy)return;
    const pend={};
    sellers.forEach(s=>{const a=s.staffAccess||{};Object.keys(a).forEach(id=>{const x=a[id];if(x.status==="pending"&&x.job)(pend[x.job]=pend[x.job]||[]).push([s.id,id]);});});
    const jobs=Object.keys(pend);if(!jobs.length)return;
    pqBusy=true;
    try{
      for(const fid of jobs){
        let j=null;
        try{const r=await mcp.callTool(DRIVE,"download_file_content",{fileId:fid},{cache:false});const p=r.payload;let t=typeof p==="string"?p:(p&&(p.content||p.textContent))||"";
          if(t&&String(t).trim()[0]!=="{"){try{t=b64utf8(t);}catch(e){}}j=JSON.parse(String(t).replace(/^﻿/,""));}catch(e){continue;}
        if(!j||!Array.isArray(j.results))continue;
        const bySel={};pend[fid].forEach(([sid,stid])=>{(bySel[sid]=bySel[sid]||[]).push(stid);});
        for(const sid of Object.keys(bySel)){
          const s=sellerById(sid);if(!s)continue;const acc=JSON.parse(JSON.stringify(s.staffAccess||{}));
          bySel[sid].forEach(stid=>{const a=acc[stid];if(!a)return;const res=j.results.find(x=>x.seller===sid&&x.email===a.email&&x.op===a.op);if(!res)return;
            acc[stid]=Object.assign({},a,{status:res.ok?(a.op==="revoke"?"gone":"ok"):"err",msg:(res.steps||[]).join(" · "),at:j.doneAt||new Date().toISOString()});});
          try{await db.collection(SC).doc(sid).update({staffAccess:acc});}catch(e){}
        }
      }
    }finally{pqBusy=false;}
    pqTimer=setTimeout(pqPoll,20000);
  }
  function pqKick(){if(!pqTimer&&!pqBusy)pqTimer=setTimeout(pqPoll,3000);}

  // ---- Tab Nhân sự ----

    const q=(staffQ||"").toLowerCase();
    const card=m=>{
      const list=sellersOfStaff(m.id),col=colorFor(m.name||m.email);
      return `<div class="pq-card${staffActive(m)?"":" off"}">

            <div class="muted" style="font-size:12.5px">${esc(m.email||"chưa có Gmail")}${m.phone?" · "+esc(m.phone):""}</div></div>
          <button class="btn" data-st-assign="${esc(m.id)}" style="padding:5px 11px;font-size:12.5px"${staffActive(m)?"":" disabled"}>Giao khách</button>
          <button class="btn btn-ghost icon-btn" data-st-edit="${esc(m.id)}" title="Sửa" aria-label="Sửa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button></div>
        <div class="pq-list">${list.length?list.map(s=>`<div class="pq-row"><button class="lnk" data-open="${esc(s.id)}">${esc(s.name||"—")}</button>${accBadge((s.staffAccess||{})[m.id])}
          <button class="btn btn-ghost" data-st-un="${esc(m.id)}|${esc(s.id)}" title="Bỏ giao & thu hồi quyền" style="padding:2px 8px;font-size:12px;color:var(--danger)">Bỏ giao</button></div>`).join(""):`<div class="muted" style="font-size:12.5px">Chưa phụ trách khách nào.</div>`}</div></div>`;
    };
    const flt=l=>l.filter(m=>!q||((m.name||"")+" "+(m.email||"")+" "+(m.role||"")).toLowerCase().indexOf(q)>=0).sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi"));
    const g=el("div","pq-grid");g.innerHTML=flt(act).map(card).join("");v.appendChild(g);
    if(off.length){v.appendChild(el("div","side-sec",`Đã nghỉ (${off.length})`));const g2=el("div","pq-grid");g2.innerHTML=flt(off).map(card).join("");v.appendChild(g2);}
    $("#stAdd").onclick=()=>openStaffForm(null);
    const sq=$("#stQ");sq.oninput=()=>{staffQ=sq.value;const p=sq.selectionStart;renderStaff();const n=$("#stQ");n.focus();try{n.setSelectionRange(p,p);}catch(e){}};
    const rt=$("#stRetry");if(rt)rt.onclick=()=>staffSync(sellers.filter(s=>accList(s).some(a=>a.status==="err")).map(s=>s.id));
    v.querySelectorAll("[data-st-edit]").forEach(b=>b.onclick=()=>openStaffForm(staffById(b.dataset.stEdit)));
    v.querySelectorAll("[data-st-assign]").forEach(b=>b.onclick=()=>openStaffAssign(b.dataset.stAssign));
    v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
    v.querySelectorAll("[data-st-un]").forEach(b=>b.onclick=async()=>{const [mid,sid]=b.dataset.stUn.split("|"),s=sellerById(sid),m=staffById(mid);if(!s)return;
      if(!(await confirmBox("Bỏ giao "+(s.name||"")+" cho "+(m&&m.name||"")+"? Quyền chỉnh sửa folder, sheet ATS và link ATS của nhân sự này sẽ bị thu hồi.")))return;
      await setSellerStaff(sid,(s.staffIds||[]).filter(x=>x!==mid));});
  }
  async function confirmBox(msg){return window.confirm(msg);}
  async function setSellerStaff(sid,ids){
    const s=sellerById(sid);if(!s)return;
    try{await db.collection(SC).doc(sid).update({staffIds:ids,updatedAt:new Date().toISOString()});}catch(e){toast("Không lưu được","err");return;}
    s.staffIds=ids;await staffSync([sid]);
  }
  function stModal(title,body,foot){
    const old=$("#stOv");if(old)old.remove();
    const ov=el("div","overlay");ov.id="stOv";ov.style.zIndex="60";
    ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="icon-btn btn btn-ghost" data-stclose aria-label="Đóng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});

      <div class="field"><label class="fl">Quyền</label><select id="st_level"><option value="Nhân viên" ${staffLevel(o)==="Nhân viên"?"selected":""}>Nhân viên – làm việc trên ATS, folder Drive của khách</option><option value="Trưởng nhóm" ${staffLevel(o)==="Trưởng nhóm"?"selected":""}>Trưởng nhóm – như Nhân viên + xem Google Sheet ATS + tạo/gửi link cho Khách</option></select></div>
      <div class="field"><label class="fl">Vai trò / mảng phụ trách</label><input id="st_role" type="text" value="${esc(o.role||"")}" placeholder="VD: Vận hành sàn, Content, Ads…"></div>

      `${m&&!sellersOfStaff(m.id).length?`<button class="btn" id="st_del" style="margin-right:auto;color:var(--danger)">Xoá</button>`:""}<button class="btn" data-stclose>Huỷ</button><button class="btn btn-primary" id="st_save">${m?"Lưu":"Thêm"}</button>`);

    $("#st_save").onclick=async()=>{

  // Giao nhiều khách cho 1 nhân sự
  function openStaffAssign(mid){
    const m=staffById(mid);if(!m)return;
    let q="";
    const cur=new Set(sellersOfStaff(mid).map(s=>s.id));
    const listHtml=()=>sellers.filter(s=>!q||(s.name||"").toLowerCase().indexOf(q)>=0).sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi")).map(s=>`<label class="pq-pick"><input type="checkbox" value="${esc(s.id)}" ${cur.has(s.id)?"checked":""}><span>${esc(s.name||"—")}</span>${s.driveFolderId||s.atsSheetId?`<span class="muted" style="font-size:11.5px;margin-left:auto">${s.driveFolderId?"📁":""}${s.atsSheetId?" 📊":""}</span>`:`<span class="muted" style="font-size:11.5px;margin-left:auto">chưa có folder/ATS</span>`}</label>`).join("")||`<div class="muted">Không có khách.</div>`;

    ov.querySelectorAll("[data-stclose]").forEach(b=>b.onclick=()=>ov.remove());

    bind();$("#stp_q").oninput=e=>{q=e.target.value.toLowerCase();$("#stp_l").innerHTML=listHtml();bind();};
    $("#stp_save").onclick=async()=>{
      const before=new Set(sellersOfStaff(mid).map(s=>s.id)),chg=[];

      ov.remove();
      if(chg.length)await staffSync(chg);else toast("Không có thay đổi");
    };
  }
  // Trong chi tiết khách: chọn nhân sự phụ trách
  function staffDetailHtml(s){
    const ids=s.staffIds||[],acc=s.staffAccess||{};

  // ==================== KB Studio — liên kết 2 chiều (cổng MCP "kb-studio" trên máy) ====================

  const KB="host:kb-studio", SN_LINK=location.href.split("#")[0];

  let kbState="cho", kbKhach=[], kbBusy=false, kbPushOff=false, kbLastPush=0, kbMsg="";
  async function kbCall(tool,input){ if(!mcp) throw {code:"no_mcp"}; const r=await mcp.callTool(KB,tool,input||{}); return r&&r.payload; }
  function kbErr(e){ const c=e&&e.code;
    if(c==="no_mcp") return "Không gọi được KB Studio ở đây (no_mcp) — mở Seller Network trong app Claude trên máy có KB Studio.";
    if(c==="server_not_connected") return "App Claude trên máy này chưa kết nối cổng kb-studio (server_not_connected) — kiểm tra Settings › Developer, rồi thoát hẳn app (⌘Q) và mở lại.";

    if(c==="tool_error"){ const t=e.result&&e.result.content&&e.result.content[0]&&e.result.content[0].text; return "KB Studio báo: "+(t||e.message||"lỗi"); }
    return "Không kết nối được KB Studio ("+(c||"lỗi")+")."; }
  function kbSeller(s){
    const pk=s.servicePackId&&typeof packById==="function"?packById(s.servicePackId):null, pr=s.projectId&&typeof projectById==="function"?projectById(s.projectId):null;

      servicePackName:pk?(pk.name||pk.ten||""):"",projectName:pr?(pr.name||""):"",briefLink:s.briefLink||s.briefDriveLink||"",products:(s.products||[]).slice(0,60)}; }
  function kbTom(th){ return th?{khachId:th.khach_id,ten:th.ten,nganh:th.nganh_ten||"",tuyen:th.tuyen||[],soJob:th.so_job||0,soKB:th.so_kb||0,dem:th.dem||{},jobs:th.jobs||[],kbMoi:th.kb_moi||[],link:th.link||"",capNhat:th.cap_nhat||"",dongBo:new Date().toISOString()}:null; }

  // Đồng bộ: đọc (không hỏi) → cập nhật tổng hợp vào SN; đẩy dữ liệu seller sang KB (ghi) tối đa 1 lần / 5 phút
  async function kbSync(manual){
    if(!mcp||!db||kbBusy) return; kbBusy=true; kbMsg="";
    try{
      const ds=await kbCall("kb_danh_sach_khach"); kbKhach=(ds&&ds.khach)||[]; kbState="ok";
      const bySn={}; kbKhach.forEach(k=>{if(k.sn_id)bySn[k.sn_id]=k;});
      const ids=kbKhach.filter(k=>k.sn_id&&sellerById(k.sn_id)).map(k=>k.khach_id);
      if(ids.length){ const th=await kbCall("kb_tong_hop",{khach_ids:ids}); for(const k of kbKhach) if(k.sn_id&&sellerById(k.sn_id)) await kbGhi(k.sn_id,kbTom(th&&th.tong_hop&&th.tong_hop[k.khach_id])); }
      for(const s of sellers) if(s.kbStudio&&s.kbStudio.khachId&&!bySn[s.id]) await kbGhi(s.id,null); // bên KB đã bỏ liên kết
      const canDay=manual||(!kbPushOff&&Date.now()-kbLastPush>5*60e3);
      if(canDay){
        kbLastPush=Date.now();
        const r=await kbCall("kb_dong_bo",{link_sn:SN_LINK,sellers:sellers.map(s=>bySn[s.id]?kbSeller(s):{id:s.id,name:s.name||"",phone:s.phone||"",full:false})});
        for(const [sid,th] of Object.entries((r&&r.ket_qua)||{})) await kbGhi(sid,kbTom(th));
        for(const c of ((r&&r.can_tao)||[])){ // KB Studio yêu cầu tạo seller mới
          const now=new Date().toISOString(), id=uid("s");
          await db.collection(SC).doc(id).set({name:c.ten||"Khách mới",stage:"new",role:"",phone:"",zalo:"",email:"",note:"Tạo từ KB Studio"+(c.gioi_thieu?": "+c.gioi_thieu:""),sales:"",adsLink:"",channelLink:"",createdAt:now,updatedAt:now});
          const t=await kbCall("kb_lien_ket",{seller:{id,name:c.ten||""},khach_id:c.khach_id,link_sn:SN_LINK});
          try{await db.collection(SC).doc(id).update({kbStudio:kbTom(t&&t.tong_hop)});}catch(_){}
          toast("Đã tạo seller “"+(c.ten||"")+"” theo yêu cầu từ KB Studio");
        }
      }
      if(manual) toast("Đã đồng bộ với KB Studio");
    }catch(e){
      const c=e&&e.code; if(c==="no_mcp"||c==="server_not_connected"||c==="not_granted"||c==="capability_disabled") kbState="khong"; else if(c==="cancelled") kbPushOff=true;
      kbMsg=kbErr(e); if(manual) toast(kbMsg);
    }finally{ kbBusy=false; kbRefreshDetail(); }

      <div class="hint" style="margin-bottom:8px">Liên kết để KB Studio nhận thông tin seller (AI đọc khi viết kịch bản) và gửi lại tiến độ kịch bản về đây.</div>

    if(!p){kbMsg="Chế độ xem này không có bảng quyền — mở Seller Network trong app Claude trên Mac.";kbRefreshDetail();return;}
    let st="unavailable"; try{st=await p.state("mcp");}catch(_){}
    if(st==="prompt"){ try{st=(await p.request(["mcp"])).mcp||st;}catch(_){} }
    if(st==="denied"){ try{await p.manage();}catch(_){toast("Mở menu Quyền của trang để bật kết nối");} try{st=await p.state("mcp");}catch(_){} }
    if(st==="granted"){ kbMsg="Đã có quyền kết nối — đang tải lại trang…"; kbRefreshDetail(); setTimeout(()=>location.reload(),800); return; }
    kbMsg=st==="unavailable"?"Kết nối (mcp) không dùng được ở chế độ xem này (unavailable) — cần mở trong app Claude trên Mac, đúng tài khoản sở hữu trang.":"Quyền kết nối đang là: "+st+" — bật lại trong menu Quyền của trang."; kbRefreshDetail(); }
  function kbBoot(){ if(kbBooted) return; kbBooted=true; if(!mcp){kbState="khong";kbMsg=kbErr({code:"no_mcp"});kbRefreshDetail();return;} setTimeout(()=>kbSync(false),1500); setInterval(()=>{if(!document.hidden)kbSync(false);},5*60e3); }

  renderAll();
  paintVer();
  connect();
})();
</script>
